<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Table</title>
<style>
  :root {
    --bg: #f6f1e7; --panel: #fffaf0; --ink: #2b2620; --muted: #645a4c;
    --line: #e2d8c6; --accent: #8a3b12; --accent-ink: #fff;
    --gm: #fffdf8; --me: #efe6d4; --sys: #675d4f; --whisper: #f3e8ff;
    --hp: #3f8f4f; --hp-low: #c0392b; --hp-mid: #d68910; --live: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f; --panel: #211d17; --ink: #ece4d6; --muted: #a39782;
      --line: #3a3328; --accent: #e07a3f; --accent-ink: #1a140d;
      --gm: #1d1a14; --me: #2b251c; --sys: #9a8f7c; --whisper: #2a2236; --live: #ff6b5a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink);
         font: 16px/1.55 Georgia, "Iowan Old Style", "Palatino Linotype", "David", "Arial Hebrew", serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel);
           border-radius: 8px; padding: 8px 14px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  input, textarea, select { padding: 10px 12px; border-radius: 8px;
                            border: 1px solid var(--line); background: var(--panel); }
  input, textarea { width: 100%; }
  select { padding: 6px 8px; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .error { color: var(--hp-low); min-height: 1.4em; }

  /* join screen */
  #join { max-width: 520px; margin: 0 auto; padding: 24px 16px 32px; }
  .topline { display: flex; justify-content: flex-end; }
  #join h1 { font-size: 1.9rem; margin: 4px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin: 16px 0; }
  .card h2 { font-size: 1.1rem; margin: 0 0 10px; }
  /* A rolled character, on the join screen */
  #rolled { margin-top: 12px; }
  #rolled .boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
  #rolled .box { border: 1px solid var(--line); border-radius: 8px; text-align: center; padding: 4px; }
  #rolled .box .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; }
  #rolled .box .v { font-size: 1.3rem; font-weight: bold; }
  #rolled .box .d { font-size: .75rem; color: var(--muted); }
  #rolled .box .d s { opacity: .6; }
  #rolled .who-rolled { margin-top: 8px; }
  .pc-choice { display: flex; justify-content: space-between; align-items: center; gap: 12px;
               width: 100%; text-align: start; margin: 6px 0; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  #seat-cards.busy button { opacity: .5; pointer-events: none; }
  label { display: block; margin: 10px 0 4px; font-size: .9rem; color: var(--muted); }

  /* table screen */
  #table { display: grid; grid-template-columns: 1fr 280px; height: 100vh; height: 100dvh; }
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex;
           justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  header .title { font-weight: bold; }
  header .where { font-size: .9rem; color: var(--muted); }
  header .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  header .tools button { padding: 6px 10px; }
  .lang-pick { padding: 5px 8px; width: auto; max-width: 11em; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  #log-new { position: relative; align-self: center; margin: -44px auto 8px; z-index: 5; border-radius: 999px;
             padding: 6px 14px; border: 1px solid var(--accent, #8a4b1f); background: var(--card, #fff);
             box-shadow: 0 2px 8px rgba(0,0,0,.25); font-size: .9rem; cursor: pointer; }
  .msg { max-width: 760px; margin: 0 auto 14px; padding: 10px 14px; border-radius: 10px; position: relative; }
  /* The story is the page: narration reads like a book; actions are compact. */
  .msg.gm { background: var(--gm); border: 1px solid var(--line); font-size: 1.07rem; line-height: 1.7;
            padding: 14px 18px; box-shadow: 0 1px 3px rgba(0, 0, 0, .06); }
  .msg.player { background: var(--me); font-size: .95rem; max-width: 640px; padding: 7px 12px; }
  .msg.player.mine { margin-inline-start: auto; margin-inline-end: max(0px, calc((100% - 760px) / 2)); }
  /* Joins, music, "one more minute"…: a quiet strip between the beats. */
  .notices { max-width: 760px; margin: -6px auto 10px; text-align: center; font-size: .8rem;
             color: var(--sys); font-style: italic; line-height: 1.5; }
  .notices .msg.system { display: inline; margin: 0; padding: 0; font-size: inherit; }
  .notices .msg.system + .msg.system::before { content: " · "; font-style: normal; }
  @media (max-width: 760px) { .msg.gm { font-size: 1.02rem; padding: 11px 13px; } }
  .msg.player.mine { border-inline-start: 3px solid var(--accent); }
  .msg.system { color: var(--sys); font-style: italic; text-align: center; padding: 2px; }
  .msg.whisper { background: var(--whisper); }
  .who { font-size: .8rem; color: var(--muted); margin-bottom: 2px; letter-spacing: .02em;
         display: flex; justify-content: space-between; gap: 8px; }
  .who button { border: 0; background: none; padding: 0 4px; font-size: .9rem; color: var(--muted); }
  .who .edited { font-style: italic; margin-inline-start: 4px; }
  /* My action: sent (still mine to fix), then read by the GM. */
  .msg .pend { font-size: .78rem; color: var(--muted); margin-top: 3px; }
  .msg .pend.read { color: var(--accent); }
  /* An action the GM ruled can't work (its player chose again), and that ruling. */
  .msg.redone .body { text-decoration: line-through; opacity: .6; }
  .msg .redo-note { font-size: .85rem; color: var(--muted); margin-top: 2px; }
  .msg.gm.redo { border-inline-start: 4px solid var(--hp-low); }
  .msg.gm.redo.for-me { box-shadow: 0 0 0 2px var(--hp-low); }
  .msg.gm.redo.warn { background: color-mix(in srgb, var(--hp-low) 10%, var(--gm)); }
  .msg.system.punished { color: var(--hp-low); font-weight: bold; font-style: normal; font-size: 1.05rem; }
  .msg.system.grew { color: var(--accent); font-weight: bold; font-style: normal; }
  .msg .edit-box { width: 100%; box-sizing: border-box; font: inherit; min-height: 3.2em;
                   resize: vertical; margin-top: 2px; }
  .msg .edit-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
  .msg .edit-actions button { font-size: .85rem; padding: 2px 10px; }
  .tr-note { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  /* The public dice log: every roll the table makes, with its DC/AC. */
  .msg.roll { background: transparent; border: 1px dashed var(--line); max-width: 560px;
              padding: 6px 12px; font-size: .92rem; }
  .msg.roll .goal { color: var(--muted); font-size: .85rem; display: flex; gap: 6px; align-items: baseline; }
  .msg.roll .goal .what { flex: 1; }
  .msg.roll .dice { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
  .msg.roll .total { font-weight: bold; font-size: 1.45rem; display: inline-block; min-width: 1.6em;
                     text-align: center; border: 2px solid var(--line); border-radius: 8px;
                     padding: 0 6px; margin-inline-start: 2px; }
  .msg.roll.success { border: 1px solid var(--hp); background: color-mix(in srgb, var(--hp) 7%, transparent); }
  .msg.roll.success .total { border-color: var(--hp); color: var(--hp); }
  .msg.roll.failure { border: 1px solid var(--hp-low); background: color-mix(in srgb, var(--hp-low) 7%, transparent); }
  .msg.roll.failure .total { border-color: var(--hp-low); color: var(--hp-low); }
  .msg.roll .why-btn { border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: .8rem;
                       background: var(--panel); }
  .msg.roll .why-list { margin: 4px 0 0; padding-inline-start: 1.2em; font-size: .82rem; color: var(--muted); }
  .msg.roll.fresh .total { animation: roll-in .7s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes roll-in { from { transform: rotate(-200deg) scale(.3); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .msg.roll.fresh .total { animation: none; } }
  .msg.roll .ok { color: var(--hp); font-weight: bold; }
  .msg.roll .bad { color: var(--hp-low); font-weight: bold; }
  .msg.roll .nat { font-weight: bold; color: var(--accent); }
  .tr-note button { border: 0; background: none; padding: 0; color: var(--accent);
                    font-size: inherit; text-decoration: underline; cursor: pointer; }
  .msg.translating .body { opacity: .65; }
  .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
  .msg p { margin: 0 0 .6em; } .msg p:last-child { margin: 0; }
  .msg h3 { margin: .2em 0 .4em; font-size: 1.05rem; }
  .msg code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; }
  #status { padding: 4px 16px; font-size: .85rem; color: var(--muted); min-height: 1.6em; }
  /* Whose move it is, in one glance. */
  #turn { margin: 0 16px; padding: 8px 14px; border-radius: 10px; font-weight: bold; font-size: 1.02rem;
          border: 2px solid var(--line); background: var(--panel); text-align: center; }
  #turn.yours { border-color: var(--accent); color: var(--accent); }
  #turn.redo { border-color: var(--hp-low); color: var(--hp-low); animation: pulse 1.2s ease-in-out infinite; }
  #turn.sent, #turn.gm, #turn.out, #turn.missed { color: var(--muted); font-weight: normal; }
  .pc .turn-tick { float: inline-end; margin-inline-end: 8px; font-size: .85rem; }
  @media (max-width: 760px) { #turn { margin: 0 8px; padding: 6px 10px; font-size: .95rem; } }
  /* The GM's turn: what it's doing and roughly how long is left. */
  #progress { padding: 8px 16px 2px; }
  #progress .label { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
                     font-size: .9rem; }
  #progress .eta { color: var(--muted); font-size: .85rem; }
  #progress #extend { padding: 2px 10px; font-size: .85rem; margin-inline-start: auto; }
  #progress .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden;
                     margin-top: 6px; }
  #progress .fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px;
                    transition: width .5s linear; }
  /* The round's countdown: red, and pulsing, when it's nearly over and you haven't acted. */
  #progress.urgent .fill { background: var(--hp-low); }
  #progress.urgent #progress-what { color: var(--hp-low); font-weight: bold;
                                    animation: pulse 1s ease-in-out infinite; }
  #progress.indeterminate .fill { width: 30%; transition: none;
                                  animation: progress-slide 1.6s ease-in-out infinite; }
  @keyframes progress-slide { from { margin-inline-start: -30%; } to { margin-inline-start: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    #progress.indeterminate .fill { animation: none; width: 100%; opacity: .35; }
  }
  form#say { border-top: 1px solid var(--line); padding: 10px 16px 14px; }
  .input-row { display: flex; gap: 8px; align-items: stretch; }
  .input-row textarea { resize: none; height: 64px; }
  #mic { min-width: 64px; font-size: 1.5rem; padding: 0 12px; }
  #mic.live { background: var(--live); border-color: var(--live); color: #fff;
              animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .7; } }
  .say-row { display: flex; justify-content: space-between; align-items: center; gap: 8px 14px;
             margin-top: 6px; flex-wrap: wrap; }
  .say-row label { margin: 0; display: flex; align-items: center; gap: 6px; }
  .say-row input[type=checkbox] { width: auto; }
  .say-row .opts { display: flex; gap: 6px 14px; flex-wrap: wrap; }
  /* One-tap starters for an action, from the character sheet. */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; scrollbar-width: thin; }
  .chips:empty { display: none; }
  .chips button { flex: 0 0 auto; padding: 4px 10px; font-size: .85rem; border-radius: 16px; }
  @media (max-width: 760px) { .chips button { min-height: 36px; } }

  aside { border-inline-start: 1px solid var(--line); overflow-y: auto; padding: 12px 14px; }
  aside h2 { font-size: .95rem; margin: 4px 0 10px; color: var(--muted); font-weight: normal;
             text-transform: uppercase; letter-spacing: .08em; }
  .pc { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .pc .name { font-weight: bold; }
  .pc .tag { font-size: .75rem; color: var(--muted); margin-inline-start: 4px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 4px 0; }
  .bar > div { height: 100%; background: var(--hp); }
  .pc .meta { font-size: .8rem; color: var(--muted); }
  /* My character, always in sight: HP, AC, slots, conditions; what just changed. */
  #mycard { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: .88rem;
            padding: 6px 16px 0; cursor: pointer; }
  #mycard .hpbar { width: 90px; height: 7px; background: var(--line); border-radius: 4px; overflow: hidden;
                   display: inline-block; vertical-align: middle; margin-inline-start: 4px; }
  #mycard .hpbar > div { height: 100%; background: var(--hp); transition: width .9s ease; }
  #mycard .cond { color: var(--hp-low); }
  #mycard .slots { font-variant-numeric: tabular-nums; letter-spacing: .05em; }
  #mycard .delta { font-weight: bold; border-radius: 6px; padding: 0 6px; color: #fff; animation: delta-in .4s ease-out; }
  #mycard .delta.down { background: var(--hp-low); }
  #mycard .delta.up { background: var(--hp); }
  @keyframes delta-in { from { transform: translateY(6px); opacity: 0; } }
  @media (max-width: 760px) { #mycard { padding: 4px 10px 0; font-size: .82rem; gap: 2px 10px; } }
  .pc { cursor: pointer; border-radius: 6px; }
  .pc:hover, .pc:focus-visible { background: var(--me); outline: none; }
  .pc .open-sheet { float: inline-end; font-size: .75rem; color: var(--muted); }
  .pc .kick { float: inline-end; border: 0; background: none; padding: 0 4px; margin-inline-start: 6px;
              font-size: .85rem; color: var(--hp-low); }
  .pc .avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
                vertical-align: middle; margin-inline-end: 6px; border: 1px solid var(--line); }
  #sheet-body .portrait { float: inline-end; width: min(180px, 42%); border-radius: 10px;
                          margin: 4px 0 8px 12px; border: 1px solid var(--line); cursor: zoom-in; }
  #sheet-body .portrait.big { float: none; width: 100%; margin: 4px 0 8px; cursor: zoom-out; }
  .msg.system img { max-width: 260px; margin: 6px auto 0; }
  .msg.system.place img { max-width: min(560px, 100%); }
  .msg.system.foe img { max-width: min(300px, 80%); border: 2px solid var(--hp-low); }
  .msg.system.npc img { max-width: min(240px, 70%); border: 1px solid var(--line); border-radius: 8px; }
  .msg.system.boss img { max-width: min(380px, 90%); border: 2px solid var(--hp-low);
                         box-shadow: 0 0 18px 4px color-mix(in srgb, var(--hp-low) 55%, transparent); }
  .msg.system.boss { color: var(--hp-low); font-weight: bold; font-style: normal; letter-spacing: .04em; }
  .msg.system.loot img { max-width: min(280px, 75%); border: 2px solid #c9a227;
                         box-shadow: 0 0 14px 2px rgba(201, 162, 39, .45); }
  .gallery-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .gallery-tabs button[aria-pressed="true"] { border-color: var(--accent); }
  #place-big.tall { max-height: 62vh; width: auto; max-width: 100%; margin: 0 auto; }
  .sheet-sec li img.thumb { width: 34px; height: 34px; object-fit: cover; border-radius: 6px;
                             vertical-align: middle; margin-inline-end: 6px; cursor: zoom-in;
                             border: 1px solid #c9a227; }
  header .where button { border: 0; background: none; padding: 0 4px; font-size: .95rem; }
  dialog#places { width: min(760px, calc(100% - 24px)); max-height: 90vh; padding: 0;
                  border: 1px solid var(--line); border-radius: 12px;
                  background: var(--panel); color: var(--ink); }
  dialog#places::backdrop { background: rgba(0, 0, 0, .55); }
  .places-body { padding: 10px 16px 16px; }
  #place-big { width: 100%; display: block; border-radius: 8px; }
  #place-name { margin: 8px 0 4px; font-size: 1.15rem; }
  #place-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 8px; margin-top: 10px; }
  #place-list button { padding: 0; border-radius: 8px; overflow: hidden; text-align: start;
                       background: var(--bg); }
  #place-list img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; }
  #place-list span { display: block; font-size: .8rem; padding: 3px 6px; }
  #place-list button[aria-current="true"] { border-color: var(--accent); }
  /* The map: where the party has been (solid), the ways seen from there (dashed). */
  #map-box { display: none; }
  #map-box.on { display: block; }
  #map-box svg { width: 100%; height: auto; max-height: 62vh; display: block;
                 background: var(--bg); border-radius: 8px; }
  #map-box .node { cursor: pointer; }
  #map-box .node:focus { outline: none; }
  #map-box .node:focus circle.ring { stroke: var(--accent); }
  #map-box text { fill: var(--ink); text-anchor: middle; }
  #map-key { font-size: .8rem; opacity: .75; margin-top: 6px; }
  .bar > div { transition: width .9s ease; }
  /* A PC's card changes the moment the story reaches them. */
  .pc.hurt { animation: hurt 1.6s ease-out; }
  .pc.healed { animation: healed 1.6s ease-out; }
  @keyframes hurt { from { background: color-mix(in srgb, var(--hp-low) 35%, transparent); } }
  @keyframes healed { from { background: color-mix(in srgb, var(--hp) 35%, transparent); } }
  /* Narration being told: tap it to show the rest at once. */
  .msg.revealing { cursor: pointer; }
  /* "Previously…": the story so far, for a player sitting (back) down. */
  #recap { max-width: 760px; margin: 12px auto; padding: 12px 16px; border: 1px solid var(--accent);
           border-radius: 12px; background: var(--gm); }
  #recap h3 { margin: 0 0 6px; font-size: 1rem; color: var(--accent); }
  #recap .text { white-space: pre-line; }
  #recap .text.pending { opacity: .75; }
  #recap .row { justify-content: flex-end; margin-top: 8px; }
  .msg.queued { display: none; }

  /* The character sheet */
  dialog#sheet { width: min(600px, calc(100% - 24px)); max-height: 88vh; padding: 0;
                 border: 1px solid var(--line); border-radius: 12px;
                 background: var(--panel); color: var(--ink); }
  dialog#sheet::backdrop { background: rgba(0, 0, 0, .45); }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
                padding: 12px 16px 8px; border-bottom: 1px solid var(--line);
                position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .sheet-head h2 { margin: 0; font-size: 1.3rem; }
  .sheet-head .sub { color: var(--muted); font-size: .9rem; }
  .sheet-head button { border: 0; background: none; font-size: 1.2rem; padding: 2px 6px; }
  #sheet-body { padding: 10px 16px 18px; }
  .sheet-sec { margin: 12px 0 0; border-radius: 6px; }
  .sheet-sec h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
                  color: var(--muted); margin: 0 0 6px; font-weight: normal; }
  .sheet-sec.changed { animation: healed 2s ease-out; }
  .sheet-sec.changed.down { animation: hurt 2s ease-out; }
  .boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
  .box { border: 1px solid var(--line); border-radius: 8px; text-align: center; padding: 6px 4px; }
  .box .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .box .v { font-size: 1.25rem; font-weight: bold; font-variant-numeric: tabular-nums; }
  .box .m { font-size: .8rem; color: var(--muted); }
  .sheet-sec ul { margin: 0; padding-inline-start: 1.2em; }
  .sheet-sec li { margin: 2px 0; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .sheet-held { font-size: .8rem; color: var(--muted); margin-top: 4px; }
  /* Levelling up from the sheet */
  .levelup { border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .levelup h3 { color: var(--accent); font-size: 1rem; text-transform: none; letter-spacing: 0; margin: 0 0 6px; }
  .levelup label { display: flex; gap: 8px; align-items: center; margin: 6px 0; color: var(--ink); }
  .levelup input[type=radio] { width: auto; }
  .levelup .asi { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .levelup textarea { min-height: 3em; resize: vertical; }
  .levelup .row { justify-content: flex-end; }
  .pc .lvl-ready { color: var(--accent); font-weight: bold; margin-inline-start: 4px; }
  .voice-settings { margin-top: 14px; font-size: .85rem; }
  .voice-settings label { margin: 8px 0 2px; }
  .voice-settings select { width: 100%; }
  .voice-settings input[type=range] { width: 100%; padding: 0; }
  #now-playing { margin-bottom: 6px; }
  #party-toggle { display: none; }
  /* The fight: order, whose turn, how the foes look, what's on the battlefield. */
  #paused { margin: 6px 16px 0; padding: 6px 10px; border-radius: 10px; border: 2px solid var(--accent);
            font-weight: bold; text-align: center; }
  #tracks { margin: 6px 16px 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; }
  #tracks .tk { display: flex; align-items: center; gap: 6px; }
  #tracks .pips { letter-spacing: 1px; color: var(--hp-low); }
  #tracks .tk.moved { animation: tkpulse 1.6s ease-out 2; }
  #tracks .note { color: var(--muted); font-size: .78rem; }
  @keyframes tkpulse { 0% { background: color-mix(in srgb, var(--hp-low) 30%, transparent); } 100% { background: transparent; } }
  #fight { margin: 6px 16px 0; padding: 6px 10px; border: 1px solid var(--hp-low); border-radius: 10px;
           background: color-mix(in srgb, var(--hp-low) 5%, var(--panel)); font-size: .88rem; }
  #fight .fhead { display: flex; justify-content: space-between; gap: 8px; color: var(--hp-low); font-weight: bold; }
  #fight .order { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 2px; scrollbar-width: thin; }
  #fight .fc { flex: 0 0 auto; display: block; border: 1px solid var(--line); border-radius: 8px;
               padding: 3px 9px; background: var(--panel); color: var(--ink); text-align: start; font-size: .85rem; }
  #fight .fc .h { display: block; font-size: .74rem; color: var(--muted); }
  #fight .fc.foe { border-color: color-mix(in srgb, var(--hp-low) 55%, var(--line)); }
  #fight .fc.now { box-shadow: 0 0 0 2px var(--accent); }
  #fight .fc.target { outline: 2px dashed var(--hp-low); outline-offset: 1px; }
  #fight .fc.down { opacity: .5; text-decoration: line-through; }
  #fight .fields { margin-top: 4px; }
  @media (max-width: 760px) { #fight { margin: 4px 8px 0; } }
  /* A phone keeps the story on screen: the tracks one scrolling line, the composer's
     two options side by side. */
  @media (max-width: 760px) {
    #tracks { margin: 4px 8px 0; flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    #paused { margin: 4px 8px 0; padding: 4px 8px; font-size: .9rem; }
    .say-row .opts { display: flex; flex-wrap: wrap; gap: 0 12px; font-size: .8rem; }
  }

  /* The players' side chat (the GM never sees it): a third column on wide screens,
     a drawer from the side on narrower ones. */
  #chat { display: none; flex-direction: column; min-height: 0; background: var(--panel);
          border-inline-start: 1px solid var(--line); }
  #chat.open { display: flex; position: fixed; top: 56px; bottom: 0; inset-inline-end: 0;
               width: min(340px, 100%); z-index: 6; box-shadow: 0 0 24px rgba(0, 0, 0, .25); }
  #chat h2 { font-size: .95rem; margin: 0; padding: 12px 14px 4px; color: var(--muted);
             font-weight: normal; text-transform: uppercase; letter-spacing: .08em; }
  #chat .note { font-size: .78rem; color: var(--muted); padding: 0 14px 6px; }
  #chat-log { flex: 1; overflow-y: auto; padding: 6px 14px; }
  .chat-msg { margin: 0 0 8px; font-size: .92rem; }
  .chat-msg .from { font-weight: bold; font-size: .8rem; color: var(--accent); }
  .chat-msg.mine .from { color: var(--muted); }
  #chat form { display: flex; gap: 6px; padding: 8px 10px 12px; border-top: 1px solid var(--line); }
  #chat input { flex: 1; padding: 8px 10px; }
  #chat form button { padding: 6px 12px; }
  /* Names from the story: hover (or tap) for what you know about them. */
  .lore { border-bottom: 1px dotted var(--accent); cursor: help; }
  #lore-card { position: fixed; z-index: 20; width: min(320px, calc(100vw - 24px));
               background: var(--panel); color: var(--ink); border: 1px solid var(--line);
               border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, .25);
               padding: 10px 12px; font-size: .9rem; }
  #lore-card .head { font-weight: bold; margin-bottom: 4px; }
  #lore-card .sub { color: var(--muted); font-size: .8rem; margin: -2px 0 4px; }
  #lore-card .kind { color: var(--muted); font-weight: normal; font-size: .78rem; margin-inline-start: 6px; }
  /* The whole picture, never cropped: a tall portrait stands centred, a wide place fills the width. */
  #lore-card img { display: block; width: auto; height: auto; max-width: 100%; max-height: min(260px, 45vh);
                  margin: 0 auto 6px; border-radius: 6px; }
  #lore-card .text.loading { color: var(--muted); font-style: italic; }
  .chat-tabs { display: flex; gap: 4px; padding: 10px 10px 0; }
  #chat-close { flex: 0 0 auto; display: none; padding: 6px 10px; }
  #chat-clear { flex: 0 0 auto; padding: 6px 10px; }
  #chat.open #chat-close { display: inline-block; }
  .chat-tabs button { flex: 1; padding: 6px 8px; font-size: .85rem; }
  .chat-tabs button[aria-pressed="true"] { border-color: var(--accent); }
  #narrator-pane, #talk-pane { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  #narrator-log { flex: 1; overflow-y: auto; padding: 6px 14px; }
  .nar-q { margin: 8px 0 2px; font-size: .88rem; color: var(--muted); }
  .nar-a { margin: 0 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--gm);
           border: 1px solid var(--line); font-size: .92rem; white-space: pre-line; }
  .nar-a.thinking { color: var(--muted); font-style: italic; }
  #chat-toggle .badge { background: var(--hp-low); color: #fff; border-radius: 9px;
                        font-size: .72rem; padding: 0 6px; margin-inline-start: 4px; }
  @media (min-width: 1180px) {
    #table { grid-template-columns: 1fr 280px 300px; }
    #chat { display: flex; }
    #chat.open { position: static; width: auto; box-shadow: none; }
    #chat-toggle { display: none; }
  }

  /* The ⋯ menu exists only on a phone; elsewhere its buttons sit in the row. */
  .more-menu { display: contents; }
  #leave { order: 1; }
  #more-toggle { display: none; }
  #tabs { display: none; }

  @media (max-width: 760px) {
    #table { grid-template-columns: 1fr; }
    aside { display: none; position: fixed; inset: 56px 0 auto 0; max-height: 65vh;
            background: var(--panel); border: 0; border-bottom: 1px solid var(--line); z-index: 5; }
    aside.open { display: block; }
    #party-toggle { display: inline-block; }

    /* Phone: the story gets the screen. One slim header row: title on the left,
       one-tap icons for sheet / party / chat, and the ⋯ menu for the rest. */
    header { padding: 4px 6px 4px 10px; flex-wrap: nowrap; gap: 6px; }
    header > div:first-child { min-width: 0; flex: 1 1 auto; }
    header .title, header .where { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .title { font-size: .9rem; }
    header .where { font-size: .75rem; }
    header .tools { flex-wrap: nowrap; flex: none; gap: 4px; }
    #sheet-toggle, #party-toggle, #chat-toggle, #more-toggle {
      display: inline-flex; align-items: center; justify-content: center; position: relative;
      min-width: 42px; height: 42px; padding: 0 6px; font-size: 0; border-radius: 10px; }
    #sheet-toggle::before { content: "📜"; font-size: 1.25rem; }
    #party-toggle::before { content: "👥"; font-size: 1.25rem; }
    #chat-toggle > span[data-i18n] { font-size: 0; }
    #chat-toggle::before { content: "💬"; font-size: 1.25rem; }
    #chat-toggle .badge { position: absolute; top: 2px; inset-inline-end: 2px; margin: 0; }
    #more-toggle { font-size: 1.4rem; line-height: 1; }
    .more-menu { display: none; position: fixed; inset-inline-end: 6px; top: 56px; z-index: 8;
                 flex-direction: column; gap: 6px; padding: 8px; min-width: 220px;
                 background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
                 box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
    .more-menu.open { display: flex; }
    .more-menu button, .more-menu .lang-pick { width: 100%; max-width: none; min-height: 44px;
                                               text-align: start; padding: 8px 12px; }
    #leave { order: 0; color: var(--hp-low); }

    /* The story: a little more of it on screen. */
    #log { padding: 10px 8px; }
    .msg { margin-bottom: 10px; padding: 9px 12px; }
    #status { padding: 2px 10px; }
    #progress { padding: 6px 10px 2px; }

    /* The action box: compact but easy to hit. 16px text keeps iPhones from
       zooming the page when the box is tapped. */
    form#say { padding: 6px 8px 8px; }
    .input-row textarea { height: 52px; font-size: 16px; padding: 8px 10px; }
    #mic { min-width: 52px; font-size: 1.3rem; padding: 0 8px; }
    .say-row { margin-top: 4px; font-size: .8rem; gap: 6px 10px; flex-wrap: nowrap; }
    .say-row .opts { flex: 1 1 auto; min-width: 0; gap: 2px 10px; }
    .say-row #me { display: none; }
    #send { min-height: 40px; padding: 6px 18px; }
    #chat input, #narrator-form input { font-size: 16px; }

    /* Phone: Story / Party / Sheet / Chat tabs at the bottom; the action box and
       the countdown stay pinned just above them. */
    #sheet-toggle, #party-toggle, #chat-toggle { display: none !important; }
    #tabs { display: flex; border-top: 1px solid var(--line); background: var(--panel);
            padding-bottom: env(safe-area-inset-bottom); }
    #tabs button { flex: 1; border: 0; border-radius: 0; background: none; min-height: 52px; padding: 4px 2px;
                   font-size: .75rem; display: flex; flex-direction: column; align-items: center; gap: 1px;
                   position: relative; }
    #tabs button .i { font-size: 1.3rem; line-height: 1.2; }
    #tabs button[aria-pressed="true"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
    #tabs .badge { position: absolute; top: 4px; inset-inline-end: 22%; background: var(--hp-low); color: #fff;
                   border-radius: 9px; font-size: .68rem; padding: 0 5px; }
    aside, #chat.open { bottom: var(--tabs-h, 56px) !important; }
    aside { max-height: none; overflow-y: auto; }

    /* Drawers and dialogs use the whole phone. */
    #chat.open { width: 100%; }
    dialog#sheet, dialog#places { width: 100%; max-width: 100%; height: 100dvh; max-height: 100dvh;
                                  margin: 0; border: 0; border-radius: 0; }
  }
</style>
</head>
<body>

<section id="join">
  <div class="topline"><select class="lang-pick hidden" data-i18n-label="language"></select></div>
  <h1 data-i18n="title"></h1>
  <p class="muted" data-i18n="intro"></p>

  <div class="card" id="code-card">
    <label for="code" data-i18n="codeLabel"></label>
    <input id="code" autocomplete="off" dir="ltr" placeholder="ember-482">
    <div class="row"><button class="primary" id="code-go" data-i18n="enter"></button></div>
    <div class="error" id="code-error"></div>
  </div>

  <div id="seat-cards" class="hidden">
    <div class="card">
      <h2 data-i18n="who"></h2>
      <div id="pc-list"></div>
      <p class="muted" id="pc-empty" data-i18n="empty"></p>
    </div>
    <div class="card">
      <h2 data-i18n="newChar"></h2>
      <label for="new-name" data-i18n="name"></label>
      <input id="new-name" maxlength="60" dir="auto" data-i18n-ph="namePh">
      <label for="new-concept" data-i18n="concept"></label>
      <input id="new-concept" maxlength="200" dir="auto" data-i18n-ph="conceptPh">
      <label for="new-sex" data-i18n="looks"></label>
      <select id="new-sex">
        <option value="" data-i18n="looksAny"></option>
        <option value="male" data-i18n="looksMan"></option>
        <option value="female" data-i18n="looksWoman"></option>
      </select>
      <div class="row">
        <button class="primary" id="create" data-i18n="create"></button>
        <button id="nameless" data-i18n="nameless"></button>
        <button id="roll-char" type="button" data-i18n="rollChar"></button>
      </div>
      <div id="rolled" class="hidden"></div>
    </div>
    <div class="error" id="seat-error"></div>
  </div>
</section>

<section id="table" class="hidden">
  <div id="main">
    <header>
      <div>
        <div class="title" id="campaign"></div>
        <div class="where" id="where"></div>
      </div>
      <div class="tools">
        <!-- On a phone the rarely-used buttons fold into the ⋯ menu; elsewhere
             .more-menu is display: contents and they sit in the row as before. -->
        <div class="more-menu" id="more-menu">
          <button id="music-toggle" type="button" aria-pressed="true"></button>
          <button id="read-toggle" type="button" aria-pressed="false"></button>
          <select class="lang-pick hidden" data-i18n-label="language"></select>
          <button id="leave" type="button" data-i18n="leave"></button>
        </div>
        <button id="stop-signal" type="button" data-i18n-label="stopSignal">✋</button>
        <button id="sheet-toggle" type="button" data-i18n="mySheet"></button>
        <button id="chat-toggle" type="button"><span data-i18n="chatButton"></span><span class="badge hidden" id="chat-unread"></span></button>
        <button id="party-toggle" type="button" data-i18n="party"></button>
        <button id="more-toggle" type="button" aria-expanded="false" aria-controls="more-menu"
                data-i18n-label="menu">⋯</button>
      </div>
    </header>
    <div id="paused" class="hidden" role="status" data-i18n="pausedNote"></div>
    <div id="tracks" class="hidden" aria-live="polite"></div>
    <div id="fight" class="hidden" aria-live="polite"></div>
    <div id="log" aria-live="polite"></div>
    <button id="log-new" type="button" class="hidden" data-i18n="newStory"></button>
    <div id="turn" class="hidden" aria-live="polite"></div>
    <div id="progress" class="hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100"
         aria-live="polite">
      <div class="label"><span id="progress-what"></span><span class="eta" id="progress-eta"></span><button
        id="extend" type="button" class="hidden" data-i18n="extend"></button></div>
      <div class="track"><div class="fill"></div></div>
    </div>
    <div id="status"></div>
    <div id="mycard" class="hidden" role="button" tabindex="0"></div>
    <form id="say">
      <div id="chips" class="chips"></div>
      <div class="input-row">
        <button id="mic" type="button" aria-pressed="false">🎤</button>
        <textarea id="text" maxlength="1200" dir="auto" data-i18n-ph="placeholder"></textarea>
      </div>
      <div class="say-row">
        <div class="opts">
          <label><input type="checkbox" id="autosend" checked> <span data-i18n="autoSend"></span></label>
          <label><input type="checkbox" id="private"> <span data-i18n="private"></span></label>
        </div>
        <span class="muted" id="me"></span>
        <button class="primary" type="submit" id="send" data-i18n="send"></button>
      </div>
    </form>
    <nav id="tabs">
      <button type="button" id="tab-story" aria-pressed="true"><span class="i">📖</span><span data-i18n="tabStory"></span></button>
      <button type="button" id="tab-party" aria-pressed="false"><span class="i">👥</span><span data-i18n="tabParty"></span></button>
      <button type="button" id="tab-sheet" aria-pressed="false"><span class="i">🧾</span><span data-i18n="tabSheet"></span></button>
      <button type="button" id="tab-chat" aria-pressed="false"><span class="i">💬</span><span data-i18n="tabChat"></span><span class="badge hidden" id="tab-chat-unread"></span></button>
    </nav>
  </div>
  <aside id="party">
    <h2 data-i18n="partyTitle"></h2>
    <div id="party-list"></div>
    <div class="voice-settings">
      <div id="now-playing" class="muted" dir="auto"></div>
      <label for="music-vol" data-i18n="musicVol"></label>
      <input id="music-vol" type="range" min="0" max="1" step="0.05" value="0.8">
      <label for="rate" data-i18n="speed"></label>
      <select id="rate">
        <option value="0.85" data-i18n="slower"></option>
        <option value="1" selected data-i18n="normal"></option>
        <option value="1.15" data-i18n="faster"></option>
      </select>
      <div id="voice-menus"></div>
      <p class="muted hidden" id="edge-hint" data-i18n="edgeHint"></p>
    </div>
  </aside>
  <section id="chat" aria-labelledby="chat-title">
    <div class="chat-tabs">
      <button type="button" id="tab-talk" aria-pressed="true" data-i18n="chatTitle"></button>
      <button type="button" id="tab-narrator" aria-pressed="false" data-i18n="narTitle"></button>
      <button type="button" id="chat-clear" data-i18n-label="chatClear">🧹</button>
      <button type="button" id="chat-close" aria-label="✕">✕</button>
    </div>
    <div id="talk-pane">
      <h2 id="chat-title" class="hidden" data-i18n="chatTitle"></h2>
      <div class="note" data-i18n="chatNote"></div>
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form">
        <input id="chat-text" maxlength="500" autocomplete="off" dir="auto" data-i18n-ph="chatPh">
        <button type="submit" data-i18n="chatSend"></button>
      </form>
    </div>
    <div id="narrator-pane" class="hidden">
      <div class="note" data-i18n="narNote"></div>
      <div id="narrator-log" aria-live="polite"></div>
      <form id="narrator-form">
        <input id="narrator-text" maxlength="400" autocomplete="off" dir="auto" data-i18n-ph="narPh">
        <button type="submit" data-i18n="narAsk"></button>
      </form>
    </div>
  </section>
</section>

<div id="lore-card" class="hidden" role="tooltip"></div>

<dialog id="places" aria-labelledby="places-title">
  <div class="sheet-head">
    <h2 id="places-title" data-i18n="placesTitle"></h2>
    <button id="places-close" type="button" aria-label="✕">✕</button>
  </div>
  <div class="places-body">
    <div class="gallery-tabs" id="gallery-tabs"></div>
    <div id="map-box"></div>
    <img id="place-big" alt="">
    <div id="place-name" dir="auto"></div>
    <div id="place-list"></div>
  </div>
</dialog>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-head">
    <div><h2 id="sheet-title" dir="auto"></h2><div class="sub" id="sheet-sub" dir="auto"></div></div>
    <button id="sheet-close" type="button" aria-label="✕">✕</button>
  </div>
  <div id="sheet-body"></div>
</dialog>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem("gmtable." + k); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem("gmtable." + k)
                                 : localStorage.setItem("gmtable." + k, v); } catch (e) {} },
  };

  // ------------------------------------------------------------- i18n ---
  // The page's words, from lib/table_strings.json (put in where the page is served);
  // the adventure's other languages come from the table (/api/ui) when chosen.
  const STRINGS = /*TABLE_STRINGS*/{ en: {} };
  // The languages this adventure is played in (chosen by the GM when it starts;
  // English alone by default): [{code, name, native, rtl}]. The table says which.
  let LANGS = [{ code: "en", name: "English", native: "English", rtl: false }];
  const RTL = new Set(["he", "yi", "ar", "fa", "ur"]);
  const isRtl = (l) => RTL.has(String(l || "").split("-")[0]);
  const langBase = (l) => String(l || "").split("-")[0].toLowerCase();
  let langChosen = !!store.get("lang");
  let lang = store.get("lang") || "en";
  // The best of the table's languages for this player: their choice, else their
  // browser's, else the language the adventure is mainly told in.
  function pickLang(want) {
    const codes = LANGS.map((x) => x.code);
    const tries = [want, store.get("lang"), ...(navigator.languages || [navigator.language || ""])];
    for (const w of tries.filter(Boolean)) {
      if (codes.includes(w)) return w;
      const hit = codes.find((c) => langBase(c) === langBase(w));
      if (hit) return hit;
    }
    return codes[0];
  }
  const t = (k) => (STRINGS[lang] && STRINGS[lang][k]) || STRINGS.en[k] || k;
  const langLabel = (code) => (STRINGS[lang] && STRINGS[lang]["lang_" + code])
    || (LANGS.find((x) => x.code === code) || {}).native || code;

  // The page's words in a language it doesn't ship with: translated by the table.
  const uiLoading = new Set();
  async function loadStrings(l, tries = 0) {
    if (STRINGS[l] && STRINGS[l].__done) return;
    if (uiLoading.has(l) && !tries) return;
    uiLoading.add(l);
    const r = await api("/api/ui?lang=" + encodeURIComponent(l));
    if (r.ok) {
      STRINGS[l] = Object.assign({}, STRINGS[l] || {}, r.strings || {});
      if (!r.pending) STRINGS[l].__done = true;
      if (l === lang) { applyLang(); if (me) rerenderLog(); }
    }
    if (r.ok && r.pending && tries < 40) setTimeout(() => loadStrings(l, tries + 1), 5000);
    else uiLoading.delete(l);
  }
  // The table told us its languages: offer them, and settle on one.
  function setLanguages(list) {
    if (!Array.isArray(list) || !list.length) return;
    if (list.map((x) => x.code).join() !== LANGS.map((x) => x.code).join()) LANGS = list;
    fillLangPickers();
    const best = pickLang(langChosen ? lang : null);
    if (best !== lang) setLang(best, false);
    else if (!STRINGS[lang]) loadStrings(lang);
  }
  function fillLangPickers() {
    document.querySelectorAll(".lang-pick").forEach((sel) => {
      if (sel.dataset.sig !== LANGS.map((x) => x.code).join()) {
        sel.textContent = "";
        LANGS.forEach((x) => {
          const o = document.createElement("option");
          o.value = x.code; o.textContent = x.native || x.name || x.code;
          sel.appendChild(o);
        });
        sel.dataset.sig = LANGS.map((x) => x.code).join();
      }
      sel.value = lang;
      sel.classList.toggle("hidden", LANGS.length < 2);
    });
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = isRtl(lang) ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    updateEdgeHint();
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll("[data-i18n-label]").forEach((el) => {
      el.setAttribute("aria-label", t(el.dataset.i18nLabel));
      if (el.tagName === "BUTTON") el.title = t(el.dataset.i18nLabel);     // (a tooltip: what it does)
    });
    fillLangPickers();

    rec.onresult = (e) => {
      let heard = "";
      for (let i = 0; i < e.results.length; i++) heard += e.results[i][0].transcript;

      spoke = true;
    };

      if (e.error === "not-allowed" || e.error === "service-not-allowed") setStatus(t("micDenied"), true);
      else if (e.error !== "no-speech" && e.error !== "aborted") setStatus("🎤 " + e.error, true);

      listening = false; updateMic();

  // ---------------------------------------------------------- join flow ---
  async function enterCode() {
    code = $("code").value.trim().toLowerCase();
    $("code-error").textContent = "";
    const info = await api("/api/info");
    if (!info.ok) { $("code-error").textContent = info.error === "bad table code" ? t("badCode") : (info.error || t("badCode")); return; }
    store.set("code", code);
    setLanguages(info.languages);
    if (info.me) { me = info.me; return openTable(info); }
    showSeats(info);
  }

  function showSeats(info) {
    $("code-card").classList.add("hidden");
    $("seat-cards").classList.remove("hidden");
    const list = $("pc-list");
    list.textContent = "";
    $("pc-empty").classList.toggle("hidden", info.party.length > 0);
    info.party.forEach((pc) => {
      const b = document.createElement("button");
      b.className = "pc-choice";
      const left = document.createElement("span");
      left.innerHTML = `<strong dir="auto">${esc(pc.name)}</strong> <span class="muted" dir="auto">${esc(
        [pc.race, pc.class].filter(Boolean).join(" ") || pc.concept || "")}</span>`;
      const right = document.createElement("span");
      right.className = "muted";
      right.textContent = pc.claimed ? t("taken") : (pc.status === "dead" ? t("fallen") : t("play"));
      b.append(left, right);
      b.disabled = pc.claimed || pc.status === "dead";
      b.onclick = () => seat("/api/claim", { pc: pc.name });
      list.appendChild(b);
    });
  }

  async function seat(path, body) {
    // One request at a time: the buttons wait with the player (a hosted table may
    // take a while to answer, and every click would be another character).
    if ($("seat-cards").classList.contains("busy")) return;
    $("seat-cards").classList.add("busy");
    $("seat-error").textContent = t("sent");
    let r;
    try { r = await api(path, body); } finally { $("seat-cards").classList.remove("busy"); }
    $("seat-error").textContent = "";
    if (!r.ok) { $("seat-error").textContent = r.error || "?"; refreshSeats(); return; }
    if (me) return;                                  // (already seated meanwhile)
    token = r.token; me = r.pc; store.set("token", token);
    api("/api/lang", { lang });
    openTable(await api("/api/info"));
  }

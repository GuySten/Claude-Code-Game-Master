<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Table</title>
<style>
  :root {
    --bg: #f6f1e7; --panel: #fffaf0; --ink: #2b2620; --muted: #7a6f60;
    --line: #e2d8c6; --accent: #8a3b12; --accent-ink: #fff;
    --gm: #fffdf8; --me: #efe6d4; --sys: #8a7f70; --whisper: #f3e8ff;
    --hp: #3f8f4f; --hp-low: #c0392b; --hp-mid: #d68910; --live: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f; --panel: #211d17; --ink: #ece4d6; --muted: #a39782;
      --line: #3a3328; --accent: #e07a3f; --accent-ink: #1a140d;
      --gm: #1d1a14; --me: #2b251c; --sys: #9a8f7c; --whisper: #2a2236; --live: #ff6b5a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink);
         font: 16px/1.55 Georgia, "Iowan Old Style", "Palatino Linotype", "David", "Arial Hebrew", serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel);
           border-radius: 8px; padding: 8px 14px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  input, textarea, select { padding: 10px 12px; border-radius: 8px;
                            border: 1px solid var(--line); background: var(--panel); }
  input, textarea { width: 100%; }
  select { padding: 6px 8px; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .error { color: var(--hp-low); min-height: 1.4em; }

  /* join screen */
  #join { max-width: 520px; margin: 0 auto; padding: 24px 16px 32px; }
  .topline { display: flex; justify-content: flex-end; }
  #join h1 { font-size: 1.9rem; margin: 4px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin: 16px 0; }
  .card h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .pc-choice { display: flex; justify-content: space-between; align-items: center; gap: 12px;
               width: 100%; text-align: start; margin: 6px 0; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  label { display: block; margin: 10px 0 4px; font-size: .9rem; color: var(--muted); }

  /* table screen */
  #table { display: grid; grid-template-columns: 1fr 280px; height: 100vh; height: 100dvh; }
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header { padding: 8px 16px; border-bottom: 1px solid var(--line); display: flex;
           justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  header .title { font-weight: bold; }
  header .where { font-size: .9rem; color: var(--muted); }
  header .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  header .tools button { padding: 6px 10px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 760px; margin: 0 auto 14px; padding: 10px 14px; border-radius: 10px; position: relative; }
  .msg.gm { background: var(--gm); border: 1px solid var(--line); }
  .msg.player { background: var(--me); }
  .msg.player.mine { border-inline-start: 3px solid var(--accent); }
  .msg.system { color: var(--sys); font-style: italic; text-align: center; padding: 2px; }
  .msg.whisper { background: var(--whisper); }
  .who { font-size: .8rem; color: var(--muted); margin-bottom: 2px; letter-spacing: .02em;
         display: flex; justify-content: space-between; gap: 8px; }
  .who button { border: 0; background: none; padding: 0 4px; font-size: .9rem; color: var(--muted); }
  .tr-note { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  /* The public dice log: every roll the table makes, with its DC/AC. */
  .msg.roll { background: transparent; border: 1px dashed var(--line); max-width: 560px;
              padding: 6px 12px; font-size: .92rem; }
  .msg.roll .goal { color: var(--muted); font-size: .85rem; }
  .msg.roll .dice { font-variant-numeric: tabular-nums; }
  .msg.roll .total { font-weight: bold; font-size: 1.05rem; }
  .msg.roll .ok { color: var(--hp); font-weight: bold; }
  .msg.roll .bad { color: var(--hp-low); font-weight: bold; }
  .msg.roll .nat { font-weight: bold; color: var(--accent); }
  .tr-note button { border: 0; background: none; padding: 0; color: var(--accent);
                    font-size: inherit; text-decoration: underline; cursor: pointer; }
  .msg.translating .body { opacity: .65; }
  .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
  .msg p { margin: 0 0 .6em; } .msg p:last-child { margin: 0; }
  .msg h3 { margin: .2em 0 .4em; font-size: 1.05rem; }
  .msg code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; }
  #status { padding: 4px 16px; font-size: .85rem; color: var(--muted); min-height: 1.6em; }
  /* The GM's turn: what it's doing and roughly how long is left. */
  #progress { padding: 8px 16px 2px; }
  #progress .label { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
                     font-size: .9rem; }
  #progress .eta { color: var(--muted); font-size: .85rem; }
  #progress .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden;
                     margin-top: 6px; }
  #progress .fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px;
                    transition: width .5s linear; }
  #progress.indeterminate .fill { width: 30%; transition: none;
                                  animation: progress-slide 1.6s ease-in-out infinite; }
  @keyframes progress-slide { from { margin-inline-start: -30%; } to { margin-inline-start: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    #progress.indeterminate .fill { animation: none; width: 100%; opacity: .35; }
  }
  form#say { border-top: 1px solid var(--line); padding: 10px 16px 14px; }
  .input-row { display: flex; gap: 8px; align-items: stretch; }
  .input-row textarea { resize: none; height: 64px; }
  #mic { min-width: 64px; font-size: 1.5rem; padding: 0 12px; }
  #mic.live { background: var(--live); border-color: var(--live); color: #fff;
              animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .7; } }
  .say-row { display: flex; justify-content: space-between; align-items: center; gap: 8px 14px;
             margin-top: 6px; flex-wrap: wrap; }
  .say-row label { margin: 0; display: flex; align-items: center; gap: 6px; }
  .say-row input[type=checkbox] { width: auto; }
  .say-row .opts { display: flex; gap: 6px 14px; flex-wrap: wrap; }

  aside { border-inline-start: 1px solid var(--line); overflow-y: auto; padding: 12px 14px; }
  aside h2 { font-size: .95rem; margin: 4px 0 10px; color: var(--muted); font-weight: normal;
             text-transform: uppercase; letter-spacing: .08em; }
  .pc { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .pc .name { font-weight: bold; }
  .pc .tag { font-size: .75rem; color: var(--muted); margin-inline-start: 4px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 4px 0; }
  .bar > div { height: 100%; background: var(--hp); }
  .pc .meta { font-size: .8rem; color: var(--muted); }
  .voice-settings { margin-top: 14px; font-size: .85rem; }
  .voice-settings label { margin: 8px 0 2px; }
  .voice-settings select { width: 100%; }
  .voice-settings input[type=range] { width: 100%; padding: 0; }
  #now-playing { margin-bottom: 6px; }
  #party-toggle { display: none; }

  @media (max-width: 760px) {
    #table { grid-template-columns: 1fr; }
    aside { display: none; position: fixed; inset: 56px 0 auto 0; max-height: 65vh;
            background: var(--panel); border: 0; border-bottom: 1px solid var(--line); z-index: 5; }
    aside.open { display: block; }
    #party-toggle { display: inline-block; }
  }
</style>
</head>
<body>

<section id="join">
  <div class="topline"><button class="lang-toggle" type="button"></button></div>
  <h1 data-i18n="title"></h1>
  <p class="muted" data-i18n="intro"></p>

  <div class="card" id="code-card">
    <label for="code" data-i18n="codeLabel"></label>
    <input id="code" autocomplete="off" dir="ltr" placeholder="ember-482">
    <div class="row"><button class="primary" id="code-go" data-i18n="enter"></button></div>
    <div class="error" id="code-error"></div>
  </div>

  <div id="seat-cards" class="hidden">
    <div class="card">
      <h2 data-i18n="who"></h2>
      <div id="pc-list"></div>
      <p class="muted" id="pc-empty" data-i18n="empty"></p>
    </div>
    <div class="card">
      <h2 data-i18n="newChar"></h2>
      <label for="new-name" data-i18n="name"></label>
      <input id="new-name" maxlength="60" dir="auto" data-i18n-ph="namePh">
      <label for="new-concept" data-i18n="concept"></label>
      <input id="new-concept" maxlength="200" dir="auto" data-i18n-ph="conceptPh">
      <div class="row">
        <button class="primary" id="create" data-i18n="create"></button>
        <button id="nameless" data-i18n="nameless"></button>
      </div>
    </div>
    <div class="error" id="seat-error"></div>
  </div>
</section>

<section id="table" class="hidden">
  <div id="main">
    <header>
      <div>
        <div class="title" id="campaign"></div>
        <div class="where" id="where"></div>
      </div>
      <div class="tools">
        <button id="music-toggle" type="button" aria-pressed="true"></button>
        <button id="read-toggle" type="button" aria-pressed="false"></button>
        <button class="lang-toggle" type="button"></button>
        <button id="party-toggle" type="button" data-i18n="party"></button>
        <button id="leave" type="button" data-i18n="leave"></button>
      </div>
    </header>
    <div id="log" aria-live="polite"></div>
    <div id="progress" class="hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100"
         aria-live="polite">
      <div class="label"><span id="progress-what"></span><span class="eta" id="progress-eta"></span></div>
      <div class="track"><div class="fill"></div></div>
    </div>
    <div id="status"></div>
    <form id="say">
      <div class="input-row">
        <button id="mic" type="button" aria-pressed="false">🎤</button>
        <textarea id="text" maxlength="1200" dir="auto" data-i18n-ph="placeholder"></textarea>
      </div>
      <div class="say-row">
        <div class="opts">
          <label><input type="checkbox" id="autosend" checked> <span data-i18n="autoSend"></span></label>
          <label><input type="checkbox" id="private"> <span data-i18n="private"></span></label>
        </div>
        <span class="muted" id="me"></span>
        <button class="primary" type="submit" id="send" data-i18n="send"></button>
      </div>
    </form>
  </div>
  <aside id="party">
    <h2 data-i18n="partyTitle"></h2>
    <div id="party-list"></div>
    <div class="voice-settings">
      <div id="now-playing" class="muted" dir="auto"></div>
      <label for="music-vol" data-i18n="musicVol"></label>
      <input id="music-vol" type="range" min="0" max="1" step="0.05" value="0.8">
      <label for="rate" data-i18n="speed"></label>
      <select id="rate">
        <option value="0.85" data-i18n="slower"></option>
        <option value="1" selected data-i18n="normal"></option>
        <option value="1.15" data-i18n="faster"></option>
      </select>
      <label for="voice-en" data-i18n="voiceEn"></label>
      <select id="voice-en"></select>
      <label for="voice-he" data-i18n="voiceHe"></label>
      <select id="voice-he"></select>
    </div>
  </aside>
</section>

  // The shared clock all music is timed against. Each /api/info round trip gives a
  // sample (server time minus our time, corrected by half the round trip); the
  // sample with the shortest round trip is the most precise, so keep the best
  // of the recent ones. A few milliseconds instead of a whole network delay.
  const clockSamples = [];
  function clockSample(serverNowSec, t0, t1) {
    clockSamples.push({ rtt: t1 - t0, skew: serverNowSec * 1000 - (t0 + t1) / 2 });
    if (clockSamples.length > 12) clockSamples.shift();

  async function api(path, body) {

    if (!r.ok && data.ok !== false) data.ok = false;

  function dirFor(text) {
    const he = (String(text).match(/[\u0590-\u05FF]/g) || []).length;
    const latin = (String(text).match(/[A-Za-z]/g) || []).length;

  // --- tiny, safe markdown: escape first, then a few inline rules ---
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;",

        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
        .replace(/(^|\s)_([^_\n]+)_/g, "$1<em>$2</em>");
      const dir = dirFor(block);
      if (/^#{1,6} /.test(h)) return `<h3 dir="${dir}">` + h.replace(/^#{1,6} /, "") + "</h3>";
      return `<p dir="${dir}">` + h.replace(/\n/g, "<br>") + "</p>";

  // --- generated ambiences (keep names in sync with AMBIENT in table_server.py) ---
  function noiseSource(ctx, color) {

    },
    epic(ctx, out, timers) {
      // D minor at 156 bpm: racing sixteenth-note bass, brass stabs, a rising
      // four-chord loop (Dm  Bb  C  A) that keeps climbing tension.
      const prog = [[50, 53, 57], [46, 50, 53], [48, 52, 55], [45, 49, 52]];
      const step = 60000 / 156 / 4;
      steps(step, (n) => {
        const s16 = n % 16, bar = Math.floor(n / 16) % 4, chord = prog[bar];
        bossDrums(ctx, out, s16);
        tone(ctx, out, hz(chord[0] - 12 + (s16 % 4 === 2 ? 12 : 0)), 0.14, 0.13, "sawtooth", 700);
        if (s16 === 0 || s16 === 6 || s16 === 10) stab(ctx, out, chord, 0.045);
        if (n % 64 === 0) chord.forEach((m) => tone(ctx, out, hz(m + 12), 9, 0.03, "triangle", 1600, 1.5));
      }, timers);
    },
    mystery(ctx, out, timers, nodes) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 73.4; g.gain.value = 0.08; o.connect(g).connect(out); o.start(); nodes.push(o);
      const notes = [74, 77, 79, 81, 84, 86];               // D minor pentatonic, up high
      steps(500, (n) => {
        if (shared01("shimmer", n) >= 0.2) return;
        const f = hz(notes[Math.floor(shared01("note", n) * notes.length)]);
        tone(ctx, out, f, 4, 0.04, "sine", 0, 1.2);
        tone(ctx, out, f + 3, 4, 0.03, "sine", 0, 1.4);      // a slow beat for shimmer
      }, timers);
    },
  };

  // An enemy's own theme: a leitmotif generated from their name, so the same
  // villain always brings the same tune (until the GM gives them a real track).
  function seeded(name) {
    let h = 2166136261;
    for (const ch of String(name).toLowerCase()) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
    return () => {
      h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16; return (h >>> 0) / 4294967296;
    };
  }
  function themeBuilder(name, boss) {
    const rnd = seeded(name), pick = (a) => a[Math.floor(rnd() * a.length)];
    const scale = pick([[0, 1, 3, 5, 7, 8, 10], [0, 2, 3, 5, 7, 8, 11], [0, 1, 3, 5, 6, 8, 10],
                        [0, 2, 3, 6, 7, 8, 11], [0, 2, 3, 5, 7, 9, 10]]);
    const root = 45 + Math.floor(rnd() * 7);
    const stepMs = 60000 / (84 + Math.floor(rnd() * 48)) / 2;
    const lead = pick(["sawtooth", "square", "triangle"]);
    const cutoff = 1200 + rnd() * 1800, heavy = rnd() < 0.5;
    const deg = (d) => root + 12 + scale[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
    const motif = Array.from({ length: 8 }, (_, i) => (i > 0 && rnd() < 0.3 ? null : Math.floor(rnd() * 9) - 1));
    const lift = 1 + Math.floor(rnd() * 3);
    if (boss) return bossThemeBuilder({ scale, root, stepMs, lead, deg, motif, lift });
    return (ctx, out, timers) => {
      steps(stepMs, (n) => {
        const bar = Math.floor(n / 8) % 4, s = n % 8;
        const d = motif[s];
        if (d !== null) tone(ctx, out, hz(deg(d + (bar === 2 ? lift : 0))), stepMs * 1.8 / 1000, 0.07, lead, cutoff);
        if (s % 4 === 0 || (heavy && s === 6)) kick(ctx, out, 0.55);
        if (s === 4 && heavy) snare(ctx, out, 0.25);
        if (s % 2 === 0) tone(ctx, out, hz(root - 12 + (s === 4 ? 7 : 0)), stepMs * 1.6 / 1000, 0.12, "sawtooth", 400);
        if (s === 0 && bar === 0) [0, 2, 4].forEach((i) => tone(ctx, out, hz(deg(i) - 12), stepMs * 30 / 1000, 0.03, "triangle", 900, 1));
      }, timers);
    };
  }
  // The SAME tune as the enemy's theme (scale, root, motif), but a boss fight:
  // much faster, the melody doubled an octave up, pounding drums, a racing
  // bass and brass stabs, rising a step every phrase for tension.
  function bossThemeBuilder(th) {
    const step = Math.min(th.stepMs / 2 * 0.75, 60000 / 150 / 4);   // sixteenths, >= 150 bpm
    return (ctx, out, timers) => {
      steps(step, (n) => {
        const s16 = n % 16, bar = Math.floor(n / 16) % 4, rise = bar === 3 ? th.lift : 0;
        bossDrums(ctx, out, s16);
        if (s16 % 2 === 0) {
          const d = th.motif[s16 / 2];
          if (d !== null) {
            tone(ctx, out, hz(th.deg(d + rise)), step * 3 / 1000, 0.07, th.lead, 2600);
            tone(ctx, out, hz(th.deg(d + rise) + 12), step * 3 / 1000, 0.035, "square", 3200);
          }
        }
        tone(ctx, out, hz(th.root - 12 + (s16 % 4 === 2 ? 12 : 0) + (rise ? th.scale[rise % 7] : 0)),
             step * 0.9 / 1000, 0.13, "sawtooth", 650);
        if (s16 === 0 || s16 === 10) stab(ctx, out, [0, 2, 4].map((i) => th.deg(i + rise) - 12), 0.045);
      }, timers);
    };
  }
  function ambientTrack(m, builder) {
    const ctx = audioCtx(), build = builder || AMBIENCES[m.src];
    if (!ctx || !build) return null;
    const master = ctx.createGain(), timers = [], nodes = [];
    master.gain.value = 0.0001;
    master.connect(ctx.destination);
    stepAnchor = (m.started_at || 0) * 1000;   // read by steps() while the track is built
    syncSeed = `${m.id}|${m.src}`;
    build(ctx, master, timers, nodes);
    const ramp = (v, sec) => {
      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(Math.max(0.0001, master.gain.value), now);
      master.gain.linearRampToValueAtTime(Math.max(0.0001, v), now + sec);
    };
    ramp(musicLevel(), 2);
    if (ctx.state === "suspended") { pendingPlay = () => ctx.resume(); setStatus(t("tapForMusic"), true); }
    return {
      setLevel(v) { ramp(v, 0.6); },
      stop() {
        ramp(0, 1.5);
        timers.stopped = true;
        timers.forEach(clearTimeout); timers.length = 0;
        setTimeout(() => { nodes.forEach((n) => { try { n.stop(); } catch (e) {} }); master.disconnect(); }, 1700);
      },
    };
  }
  function applyMusic(m, serverNow) {
    const changed = !musicState || !m || (musicState.id !== m.id);
    musicState = m || null;
    updateMusicToggle();
    if (!changed) return levelChanged();
    if (track) { track.stop(); track = null; }
    if (!m || !m.track || !musicOn) return;
    track = m.kind === "ambient" ? ambientTrack(m)
          : m.kind === "theme" ? ambientTrack(m, themeBuilder(m.src, !!m.boss))
          : fileTrack(m);
  }

  // ------------------------------------------------ speak to act (STT) ---
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, spoke = false;
  function updateMic() {
    $("mic").classList.toggle("live", listening);
    $("mic").setAttribute("aria-pressed", String(listening));
  }
  function toggleListening() {
    if (listening) { rec && rec.stop(); return; }
    if (!SR) { setStatus(t("noMic"), true); return; }
    if (!window.isSecureContext) { setStatus(t("needHttps"), true); return; }
    stopSpeaking();                      // don't let the narrator talk over the player
    rec = new SR();
    rec.lang = lang === "he" ? "he-IL" : "en-US";
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;
    const before = $("text").value.trim();
    rec.onresult = (e) => {
      let heard = "";
      for (let i = 0; i < e.results.length; i++) heard += e.results[i][0].transcript;
      $("text").value = (before ? before + " " : "") + heard.trim();
      spoke = true;
    };
    rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") setStatus(t("micDenied"), true);
      else if (e.error !== "no-speech" && e.error !== "aborted") setStatus("🎤 " + e.error, true);
    };
    rec.onend = () => {
      listening = false; updateMic();
      if (spoke && $("autosend").checked && $("text").value.trim()) { setStatus(t("heard")); sendAction(); }
      else if ($("status").textContent === t("listening")) setStatus("");
    };
    try { rec.start(); listening = true; updateMic(); setStatus(t("listening")); }
    catch (e) { setStatus("🎤 " + e.message, true); }
  }

  // ---------------------------------------------------------- join flow ---
  async function enterCode() {
    code = $("code").value.trim().toLowerCase();
    $("code-error").textContent = "";
    const info = await api("/api/info");
    if (!info.ok) { $("code-error").textContent = info.error === "bad table code" ? t("badCode") : (info.error || t("badCode")); return; }
    store.set("code", code);
    if (info.me) { me = info.me; return openTable(info); }
    showSeats(info);
  }

  function showSeats(info) {
    $("code-card").classList.add("hidden");
    $("seat-cards").classList.remove("hidden");
    const list = $("pc-list");
    list.textContent = "";
    $("pc-empty").classList.toggle("hidden", info.party.length > 0);
    info.party.forEach((pc) => {
      const b = document.createElement("button");
      b.className = "pc-choice";
      const left = document.createElement("span");
      left.innerHTML = `<strong dir="auto">${esc(pc.name)}</strong> <span class="muted" dir="auto">${esc(
        [pc.race, pc.class].filter(Boolean).join(" ") || pc.concept || "")}</span>`;
      const right = document.createElement("span");
      right.className = "muted";
      right.textContent = pc.claimed ? t("taken") : (pc.status === "dead" ? t("fallen") : t("play"));
      b.append(left, right);
      b.disabled = pc.claimed || pc.status === "dead";
      b.onclick = () => seat("/api/claim", { pc: pc.name });
      list.appendChild(b);
    });
  }

  async function seat(path, body) {
    $("seat-error").textContent = "";
    const r = await api(path, body);
    if (!r.ok) { $("seat-error").textContent = r.error || "?"; refreshSeats(); return; }
    token = r.token; me = r.pc; store.set("token", token);
    api("/api/lang", { lang });
    openTable(await api("/api/info"));
  }

  // ---------------------------------------------------------- the table ---
  function openTable(info) {
    $("join").classList.add("hidden");
    $("table").classList.remove("hidden");
    applyLang();
    renderInfo(info);
    if (!polling) {
      polling = true; pollMessages(); setInterval(refreshInfo, 4000);
      [400, 900, 1500].forEach((ms) => setTimeout(refreshInfo, ms));   // calibrate the clock
    }
  }

  function renderInfo(info) {
    if (!info || !info.ok) return;
    if (!info.me && me) {           // our PC left the table or was replaced
      me = null; token = null; store.set("token", null);
      $("table").classList.add("hidden"); $("join").classList.remove("hidden");
      return showSeats(info);
    }
    applyMusic(info.music, info.server_now);
    progressState = info.progress || { state: "idle" };
    waitingOn = info.waiting_on || [];
    updateProgress();
    $("campaign").textContent = info.campaign || t("title");
    document.title = info.campaign || t("title");
    $("where").textContent = [info.location, info.time].filter(Boolean).join(" · ");
    const list = $("party-list");
    list.textContent = "";
    info.party.forEach((pc) => {
      const d = document.createElement("div");
      d.className = "pc";
      const pct = pc.hp_max ? Math.max(0, Math.min(100, 100 * pc.hp / pc.hp_max)) : 0;
      const color = pct <= 25 ? "var(--hp-low)" : pct <= 50 ? "var(--hp-mid)" : "var(--hp)";
      const tags = [pc.lead ? t("lead") : "", pc.name === me ? t("you") : "",
                    !pc.claimed && pc.name !== me ? t("emptySeat") : ""].filter(Boolean);
      const status = pc.status && pc.status !== "alive" ? pc.status.toUpperCase() : "";
      const conds = (pc.conditions || []).join(", ");
      d.innerHTML = `<div><span class="name" dir="auto">${esc(pc.name)}</span>` +
        tags.map((x) => `<span class="tag">${esc(x)}</span>`).join("") + `</div>` +
        `<div class="bar"><div style="width:${pct}%;background:${color}"></div></div>` +
        `<div class="meta" dir="auto">HP ${esc(pc.hp)}/${esc(pc.hp_max)} · ${t("lvl")} ${esc(pc.level)} ` +
        `${esc([pc.race, pc.class].filter(Boolean).join(" "))}` +
        `${status ? " · " + esc(status) : ""}${conds ? " · " + esc(conds) : ""}</div>`;
      list.appendChild(d);
    });
    const waiting = info.waiting_on || [];
    if (!listening && !noticeShowing()) setStatus(waiting.length ? t("waiting") + waiting.join(", ") : "");
  }
  async function refreshInfo() { renderInfo(await api("/api/info")); }

  // A GM beat posted for one language only is shown to players of that language.
  const shownToMe = (m) => !(m.kind === "gm" && m.lang && m.lang !== lang);

  function systemText(m) {
    const ev = m.event;
    if (!ev || (!STRINGS.en["ev_" + ev.type] && ev.type !== "music")) return m.text;
    if (ev.type === "music") return "🎵 " + trackTitle(ev);
    let s = t("ev_" + ev.type).replace("{pc}", m.pc || "");
    if (ev.type === "join" && ev.concept) s += " — " + ev.concept;
    return s;
  }

  // ---------------------------------------------------- the GM's turn ---
  // The server says when the GM started on the players' actions, how long its
  // turns usually take (the median of the last ones) and what it is doing right
  // now (reported by a Claude Code hook as its tools run). The bar fills toward
  // that estimate and never pretends: past it, it says the turn is running long.
  let progressState = { state: "idle" }, waitingOn = [], lastGmId = 0, mySentId = 0, mySentAt = 0;
  const serverNow = () => (Date.now() + skew) / 1000;
  function fmtWait(secs) {
    if (secs >= 90) return t("min").replace("{n}", String(Math.round(secs / 60)));
    const n = secs > 10 ? Math.round(secs / 5) * 5 : Math.max(1, Math.round(secs));
    return t("sec").replace("{n}", String(n));
  }
  function showProgress(what, eta, pct) {
    const box = $("progress");
    box.classList.remove("hidden");
    box.classList.toggle("indeterminate", pct == null);
    $("progress-what").textContent = what;
    $("progress-eta").textContent = eta || "";
    box.querySelector(".fill").style.width = pct == null ? "" : pct.toFixed(1) + "%";
    if (pct == null) box.removeAttribute("aria-valuenow");
    else box.setAttribute("aria-valuenow", String(Math.round(pct)));
  }
  function updateProgress() {
    const p = progressState;
    if (p.state === "working" && lastGmId <= p.start_id) {
      const now = serverNow(), elapsed = Math.max(0, now - p.started_at);
      const est = Math.max(5, p.estimate || 45);
      // No tool has run for a while: the GM is composing the narration itself.
      let stage = p.stage || "reading";
      if (stage !== "translating" && now - (p.stage_at || p.started_at) > 8) stage = "writing";
      const pct = elapsed < est ? 95 * elapsed / est
                                : 95 + 4 * (1 - Math.exp(-(elapsed - est) / est));
      const left = est - elapsed;
      showProgress(t("st_" + stage), left > 3 ? t("etaLeft").replace("{t}", fmtWait(left))
                                              : t("etaLonger"), pct);
      return;
    }
    // My action is in, but the GM hasn't started on it yet.
    if (mySentId && lastGmId < mySentId && Date.now() - mySentAt < 15 * 60 * 1000) {
      const others = waitingOn.filter((n) => n !== me);
      showProgress(others.length ? t("sentWaiting").replace("{names}", others.join(", "))
                                 : t("sent"), "", null);
      return;
    }
    $("progress").classList.add("hidden");
  }
  setInterval(updateProgress, 500);

  // Every player reads one language. A message written in another one shows its
  // translation (sent by the GM with `gm-table.sh translate`), with the original a
  // tap away; until the translation arrives, the original shows, marked.
  const msgEls = new Map();            // message id -> its element, to update in place
  const showOriginal = new Set();      // ids this player flipped back to the original
  function sourceLang(m) { return m.lang || (dirFor(m.text || "") === "rtl" ? "he" : "en"); }
  function readable(m) {
    if (m.kind === "system" || !m.text || (m.kind === "player" && m.pc === me)) return null;
    if (m.kind === "gm" && m.lang) return null;           // already one version per language
    const src = sourceLang(m);
    if (src === lang) return null;
    const tr = (m.tr || {})[lang];
    if (m.kind === "gm" && !tr) return null;   // narration: the GM posts per language
    return { src, text: tr || null };
  }

  function addMessage(m) {
    const d = renderMessage(m);
    if (d) $("log").appendChild(d);
  }
  function updateMessage(m) {
    const old = msgEls.get(m.id);
    const fresh = renderMessage(m);
    if (old && fresh) old.replaceWith(fresh);
    else if (fresh) $("log").appendChild(fresh);
  }

  // A roll the TABLE made (players see it the moment the GM does). Its DC/AC
  // arrived in the same request as the roll, so it was fixed before the dice landed.
  function renderRoll(m, d) {
    const ev = m.event || {};
    if (ev.secret) { d.textContent = t("rollSecret"); return; }
    const r = ev.roll || {};
    const why = (ev.why_tr || {})[lang] || ev.why || "";
    const head = document.createElement("div");
    head.className = "goal";
    head.textContent = "🎯 " + [m.pc || t("rollBy"), why].filter(Boolean).join(" — ")
      + (r.target != null ? ` · ${t(r.target_label === "AC" ? "rollAC" : "rollDC")} ${r.target}` : "");
    head.dir = dirFor(head.textContent);
    // The sum is an isolated left-to-right block (math reads that way in both
    // languages); the words around it follow the reader's language, each in its
    // own isolate so Hebrew never pulls the numbers out of order.
    const line = document.createElement("div");
    line.className = "dice";
    line.dir = lang === "he" ? "rtl" : "ltr";
    const mod = r.modifier ? ` ${r.modifier > 0 ? "+" : "−"} ${Math.abs(r.modifier)}` : "";
    const math = document.createElement("bdi");
    math.dir = "ltr";
    math.innerHTML = `🎲 ${esc(r.notation || "")}: [${esc((r.rolls || []).join("+"))}]`
      + `${esc(mod)} = <span class="total">${esc(r.total)}</span>`;
    line.appendChild(math);
    const word = (text, cls) => {
      const w = document.createElement("bdi");
      if (cls) w.className = cls;
      w.textContent = text;
      line.append("  ", w);
    };
    if ((r.discarded || []).length) word(`(${t("rollDropped")} ${r.discarded.join(", ")})`, "goal");
    if (r.natural === 20 || r.natural === 1) word(t(r.natural === 20 ? "rollNat20" : "rollNat1"), "nat");
    if (r.outcome) word(t(r.outcome === "success" ? "rollSuccess" : "rollFailure"),
                        r.outcome === "success" ? "ok" : "bad");
    d.append(head, line);
  }

  function renderMessage(m) {
    if (!shownToMe(m)) return null;
    if (m.kind === "gm" && !m.to) lastGmId = Math.max(lastGmId, m.id);
    const d = document.createElement("div");
    d.className = "msg " + m.kind + (m.to ? " whisper" : "") + (m.pc === me && m.kind === "player" ? " mine" : "");
    if (m.kind === "roll") {
      renderRoll(m, d);
    } else if (m.kind === "system") {
      d.textContent = systemText(m);
      d.dir = dirFor(d.textContent);
    } else {
      const who = document.createElement("div");
      who.className = "who";
      const label = document.createElement("span");
      label.textContent = m.kind === "gm"
        ? t("gm") + (m.to ? " — " + t("whisper") : "")
        : (m.pc || "?") + (m.voice ? " 🎤" : "") + (m.to ? " — " + t("toGm") : "");
      who.appendChild(label);
      if (m.kind === "gm" && m.text) {
        const play = document.createElement("button");
        play.type = "button"; play.textContent = "🔊"; play.title = t("replay");
        play.onclick = () => { stopSpeaking(); speak(m.text); };
        who.appendChild(play);
      }
      const body = document.createElement("div");
      body.className = "body";
      const tr = readable(m);
      const useTr = tr && tr.text && !showOriginal.has(m.id);
      body.innerHTML = md(useTr ? tr.text : (m.text || ""));
      d.append(who, body);
      if (tr) {
        const note = document.createElement("div");
        note.className = "tr-note";
        if (tr.text) {
          note.append(t("trFrom").replace("{lang}", t("lang_" + tr.src)) + " · ");
          const flip = document.createElement("button");
          flip.type = "button";
          flip.textContent = useTr ? t("trShowOriginal") : t("trShowTranslation");
          flip.onclick = () => {
            if (showOriginal.has(m.id)) showOriginal.delete(m.id); else showOriginal.add(m.id);
            updateMessage(m);
          };
          note.appendChild(flip);
        } else {
          note.textContent = t("trWaiting");
          d.classList.add("translating");
        }
        d.appendChild(note);
      }
      if (m.image) {
        const img = document.createElement("img");
        img.alt = "";
        img.loading = "lazy";
        img.src = "/images/" + encodeURIComponent(m.image) + "?code=" + encodeURIComponent(code);
        d.appendChild(img);
      }
    }
    msgEls.set(m.id, d);
    return d;
  }

  function rerenderLog() {
    $("log").textContent = "";
    msgEls.clear();
    allMessages.forEach(addMessage);
    $("log").scrollTop = $("log").scrollHeight;
  }

  async function pollMessages() {
    try {
      const r = await api("/api/messages?after=" + lastId + "&rev=" + lastRev);
      if (r.ok && typeof r.rev === "number") lastRev = Math.max(lastRev, r.rev);
      const changed = r.ok ? r.messages.filter((m) => m.id <= lastId) : [];
      changed.forEach((m) => {
        const i = allMessages.findIndex((x) => x.id === m.id);
        if (i >= 0) { allMessages[i] = m; updateMessage(m); }
      });
      if (r.ok) r.messages = r.messages.filter((m) => m.id > lastId);
      if (r.ok && r.messages.length) {
        const log = $("log");
        const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
        r.messages.forEach((m) => {
          allMessages.push(m); addMessage(m); lastId = Math.max(lastId, m.id);
          // Only NEW narration is read aloud — not the history loaded on arrival.
          if (historyLoaded && readAloud && m.kind === "gm" && m.text && shownToMe(m)) speak(m.text);
        });
        if (atBottom || !historyLoaded) log.scrollTop = log.scrollHeight;
        const last = r.messages[r.messages.length - 1];
        updateProgress();
        // The music changed: fetch it now instead of on the next 4-second refresh,
        // so the new track starts with the narration it belongs to.
        // The music changed, or the narration arrived (the party's HP, held back
        // during the GM's turn, now catches up with the story): refresh now.
        if (historyLoaded && r.messages.some((m) => (m.event && /^music/.test(m.event.type))
                                                   || (m.kind === "gm" && !m.to))) refreshInfo();
      }
      historyLoaded = true;
    } catch (e) { setStatus(t("reconnecting")); }
    setTimeout(pollMessages, 1500);
  }

  async function sendAction() {
    const text = $("text").value.trim();
    if (!text) return;
    $("send").disabled = true;
    const r = await api("/api/say", { text, private: $("private").checked, lang, voice: spoke });
    if (r.ok && r.message && !r.message.to) {
      mySentId = r.message.id; mySentAt = Date.now();
      updateProgress();
      setTimeout(refreshInfo, 1200);        // catch the GM starting on it quickly
    }
    $("send").disabled = false;
    if (!r.ok) { setStatus(r.error || "?"); if (r.error === "Take a seat first.") refreshInfo(); return; }
    $("text").value = "";
    fitTextDir();
    $("private").checked = false;
    spoke = false;
  }

  // ------------------------------------------------------------- wiring ---
  $("say").onsubmit = (ev) => { ev.preventDefault(); sendAction(); };
  const fitTextDir = () => { $("text").dir = $("text").value.trim() ? dirFor($("text").value)
                                                                   : (lang === "he" ? "rtl" : "ltr"); };
  $("text").addEventListener("input", fitTextDir);
  $("text").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendAction(); }
  });
  $("mic").onclick = toggleListening;
  $("read-toggle").onclick = () => {
    readAloud = !readAloud;
    store.set("read", readAloud ? "1" : "0");
    updateReadToggle();
    if (!readAloud) stopSpeaking();
    else if (synth) speak(lang === "he" ? "ההקראה פועלת." : "Reading aloud is on.");
  };
  $("music-toggle").onclick = () => {
    musicOn = !musicOn;
    store.set("music", musicOn ? "1" : "0");
    const m = musicState;
    musicState = null;            // force a restart (or a stop) of the current track
    if (track) { track.stop(); track = null; }
    applyMusic(m);
    audioCtx();
  };
  $("music-vol").value = String(musicVol);
  $("music-vol").oninput = () => {
    musicVol = parseFloat($("music-vol").value) || 0;
    store.set("musicVol", String(musicVol));
    levelChanged();
  };
  $("rate").value = store.get("rate") || "1";
  $("rate").onchange = () => store.set("rate", $("rate").value);
  ["en", "he"].forEach((l) => {
    $("voice-" + l).onchange = (ev) => {
      store.set("voice." + l, ev.target.value || null);
      stopSpeaking(); speak(l === "he" ? "שלום, אני אקריא לכם את ההרפתקה." : "Hello, I'll read the adventure to you.");
    };
  });
  document.querySelectorAll(".lang-toggle").forEach((b) => {
    b.onclick = () => {
      lang = lang === "he" ? "en" : "he";
      store.set("lang", lang);
      applyLang();
      if (me) { api("/api/lang", { lang }); rerenderLog(); refreshInfo(); updateProgress(); fitTextDir(); }
      if (!$("seat-cards").classList.contains("hidden")) refreshSeats();
    };
  });
  async function refreshSeats() { const info = await api("/api/info"); if (info.ok) showSeats(info); }
  // Keep the "who are you" list current while choosing (someone may join meanwhile).
  setInterval(() => {
    if (!me && code && !$("seat-cards").classList.contains("hidden")) refreshSeats();
  }, 4000);
  $("leave").onclick = async () => {
    if (!confirm(t("leaveConfirm"))) return;
    await api("/api/leave", {});
    token = null; me = null; store.set("token", null);
    location.reload();
  };
  $("party-toggle").onclick = () => $("party").classList.toggle("open");
  $("code-go").onclick = enterCode;
  $("code").addEventListener("keydown", (ev) => { if (ev.key === "Enter") enterCode(); });
  $("create").onclick = () => {
    const name = $("new-name").value.trim();
    if (!name) { $("seat-error").textContent = t("nameRequired"); return; }
    seat("/api/create", { name, concept: $("new-concept").value.trim() });
  };
  $("nameless").onclick = () => seat("/api/create", { mode: "nameless" });
  if (!SR) $("mic").title = t("noMic");

  applyLang();
  $("code").value = code;
  if (code) enterCode();
})();
</script>
</body>
</html>

      if (now.hp !== lastCard.hp && typeof now.hp === "number" && typeof lastCard.hp === "number") {
        const d = now.hp - lastCard.hp;
        deltas.push({ k: "dHp", n: d, cls: d > 0 ? "up" : "down", until });
      }
      conds.filter((c) => !lastCard.conds.includes(c)).forEach((c) => deltas.push({ c, cls: "down", until }));
      lastCard.conds.filter((c) => !conds.includes(c)).forEach((c) => deltas.push({ c, cls: "up", until }));
      if (lastCard.slots && now.slots && lastCard.slots !== now.slots) {
        const used = (s) => s.split(",").reduce((a, x) => a + Number(x.split(":")[1] || 0), 0);
        const d = used(now.slots) - used(lastCard.slots);
        if (d) deltas.push({ k: d < 0 ? "dSlotUsed" : "dSlotBack", cls: d < 0 ? "down" : "up", until });
      }
    }
    lastCard = now;
    const live = deltas.filter((d) => d.until > Date.now());
    deltas.length = 0; deltas.push(...live);
    const sig = [lang, pc.hp, pc.hp_max, pc.ac, conds.join(","), slots.map((x) => x.lv + ":" + x.left + "/" + x.max).join(","),
                 live.map(deltaText).join("|")].join("/");
    if (card.dataset.sig === sig) return;
    card.dataset.sig = sig;
    const pct = hpPct(pc);
    const color = pct <= 25 ? "var(--hp-low)" : pct <= 50 ? "var(--hp-mid)" : "var(--hp)";
    card.innerHTML =
      `<span>❤ ${esc(t("sheet_hp"))} <b>${esc(pc.hp)}</b>/${esc(pc.hp_max)}<span class="hpbar"><div style="width:${pct}%;background:${color}"></div></span></span>` +
      (pc.ac != null ? `<span>🛡 ${esc(t("sheet_ac"))} <b>${esc(pc.ac)}</b></span>` : "") +
      (slots.length ? `<span class="slots">✨ ` + slots.map((x) =>
        `${esc(t("lvl"))} ${esc(x.lv)}: ${"●".repeat(Math.min(x.left, 9))}${"○".repeat(Math.max(0, Math.min(x.max, 9) - x.left))}`).join(" · ") + `</span>` : "") +
      (conds.length ? `<span class="cond">⚠ ${esc(conds.map((c) => tx(c)).join(", "))}</span>` : "") +
      live.map((d) => `<span class="delta ${d.cls}">${esc(deltaText(d))}</span>`).join("");
    card.title = t("openSheet");
  }
  uiHooks.push(renderMyCard);
  $("mycard").onclick = () => { if (me) openSheet(me); };
  $("mycard").onkeydown = (ev) => { if ((ev.key === "Enter" || ev.key === " ") && me) { ev.preventDefault(); openSheet(me); } };
  setInterval(() => { if (deltas.some((d) => d.until <= Date.now())) renderMyCard(); }, 1000);

  // ------------------------------------------ narration, revealed as told ---
  // New narration appears a few words at a time — in step with the voice when
  // it's read aloud — and one beat at a time. Tap it to see the rest at once.
  const reveals = [];                  // oldest first; only the first one is moving
  const REVEAL_CPS = 45;               // characters per second, when not read aloud
  let revealTimer = null, revealLast = 0;
  function revealedText(r) { return r.nodes.map((x) => x.node.data).join(""); }
  function startReveal(m, el) {
    const body = el.querySelector(".body");
    if (!body) return null;
    const nodes = [];
    const walk = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = walk.nextNode())) nodes.push({ node: n, full: n.data });
    const len = nodes.reduce((sum, x) => sum + x.full.length, 0);
    if (len < 2) return null;
    const r = { id: m.id, el, nodes, len, pos: 0, target: null, cps: REVEAL_CPS,
                spoken: false, started: false, headAt: 0, extras: [...el.querySelectorAll("img, .tr-note")] };
    r.extras.forEach((x) => x.classList.add("hidden"));
    el.classList.add("revealing");
    if (reveals.length) el.classList.add("queued");
    el.setAttribute("aria-busy", "true");
    el.addEventListener("click", () => finishReveal(r));
    setReveal(r, 0);
    reveals.push(r);
    if (!revealTimer) { revealLast = performance.now(); revealTimer = setInterval(tickReveal, 50); }
    return r;
  }
  function setReveal(r, p) {
    let off = 0;
    r.nodes.forEach((x) => {
      const k = Math.max(0, Math.min(x.full.length, p - off));
      if (x.node.data.length !== k) x.node.data = x.full.slice(0, k);
      off += x.full.length;
    });
  }
  function revealHooks(r) {
    return {
      start(item, secs) {
        r.started = true;
        r.pos = Math.max(r.pos, item.f0 * r.len);
        r.target = Math.max(r.pos, item.f1 * r.len);
        r.cps = Math.max(4, (r.target - r.pos) / Math.max(0.3, secs));
      },
      end(item) {
        r.pos = Math.max(r.pos, item.f1 * r.len);
        r.target = r.pos;
        if (reveals[0] === r) { setReveal(r, Math.floor(r.pos)); syncParty(); }
      },
      done() { finishReveal(r); },
    };
  }
  function tickReveal() {
    const now = performance.now();
    const dt = Math.min(0.25, (now - revealLast) / 1000);
    revealLast = now;
    const r = reveals[0];
    if (!r) { clearInterval(revealTimer); revealTimer = null; return; }
    if (!r.headAt) { r.headAt = now; r.el.classList.remove("queued"); }
    // Read aloud, but the voice never started (sound blocked?): type it out instead.
    if (r.spoken && !r.started && now - r.headAt > 4000) r.spoken = false;
    const log = $("log");
    const atBottom = logPinned;
    if (r.spoken) {
      if (r.target === null) return;
      r.pos = Math.min(r.target, r.pos + r.cps * dt);
    } else {
      r.pos = Math.min(r.len, r.pos + REVEAL_CPS * dt);
    }
    const before = revealedText(r).length;
    setReveal(r, Math.floor(r.pos));
    if (atBottom) log.scrollTop = log.scrollHeight;
    if (!r.spoken && r.pos >= r.len) return finishReveal(r);
    if (revealedText(r).length !== before) syncParty();
  }
  function finishReveal(r) {
    const i = reveals.indexOf(r);
    if (i < 0) return;
    reveals.splice(i, 1);
    r.nodes.forEach((x) => { x.node.data = x.full; });
    r.extras.forEach((x) => x.classList.remove("hidden"));
    r.el.classList.remove("revealing", "queued");
    wrapLore(r.el.querySelector(".body"));        // names learned while it was being told
    r.el.removeAttribute("aria-busy");
    if (logPinned) followLog();
    syncParty();
  }
  // The story follows the newest line unless the player scrolled up to read: only their
  // own scrolling unpins it. Panels growing above it (a fight, tracks, the turn banner)
  // shrink the log without moving it, so a resize keeps a pinned log at the bottom.
  let logPinned = true;
  function followLog() {
    const log = $("log");
    log.scrollTop = log.scrollHeight;
    logPinned = true;
    $("log-new").classList.add("hidden");
  }
  (function watchLog() {
    const log = $("log");
    let byUser = false;
    ["wheel", "touchmove", "keydown", "pointerdown"].forEach((ev) =>
      log.addEventListener(ev, () => { byUser = true; }, { passive: true }));
    log.addEventListener("scroll", () => {
      if (!byUser) return;
      byUser = false;
      logPinned = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
      if (logPinned) $("log-new").classList.add("hidden");
    }, { passive: true });
    if (window.ResizeObserver) new ResizeObserver(() => { if (logPinned) log.scrollTop = log.scrollHeight; }).observe(log);
    $("log-new").onclick = followLog;
  })();
  function finishAllReveals() { reveals.slice().forEach(finishReveal); }

  // A GM beat posted for one language only is shown to players of that language.
  const shownToMe = (m) => !(m.kind === "gm" && m.lang && m.lang !== lang);

  function systemText(m) {
    const ev = m.event;
    if (!ev || (!STRINGS.en["ev_" + ev.type] && ev.type !== "music")) return m.text;
    if (ev.type === "music") return "🎵 " + trackTitle(ev);
    let s = t("ev_" + ev.type).replace("{pc}", m.pc || "");
    if (ev.type === "place") return s.replace("{location}", ev.location || "");
    if (ev.type === "foe") return t(ev.boss ? "ev_boss" : "ev_foe").replace("{name}", ev.name || "");
    if (ev.type === "npc") return ev.of ? t("ev_npc_of").replace("{name}", ev.name || "").replace("{pc}", ev.of)
                                        : t("ev_npc").replace("{name}", ev.name || "");
    if (ev.type === "levelready") return s.replace("{level}", ev.level);
    if (ev.type === "punished") return t("ev_punished_" + ev.way).replace("{pc}", m.pc || "");
    if (ev.type === "grew") return s.replace("{what}", (ev.what_tr || {})[lang] || ev.what || "");
    if (ev.type === "nemesis") return s.replace("{name}", ev.of || "");
    if (ev.type === "purse") {
      // A PC's money and belongings changed (told privately to its player).
      const parts = [];
      const coin = (c) => (STRINGS.en["coin_" + c] ? t("coin_" + c) : tx(c));
      (ev.money || []).forEach((c) => parts.push(
        `💰 \u2066${c.delta > 0 ? "+" : ""}${c.delta}\u2069 ${coin(c.cur)} (${t("purseNow")} \u2066${c.now}\u2069)`));
      if ((ev.gained || []).length) parts.push("🎒 " + t("purseGot") + ": " + ev.gained.map(tx).join(", "));
      if ((ev.lost || []).length) parts.push("🎒 " + t("purseLost") + ": " + ev.lost.map(tx).join(", "));
      (ev.changed || []).forEach(([a, b]) => parts.push("🎒 " + tx(a) + " → " + tx(b)));
      return s + " " + parts.join(" · ");
    }
    if (ev.type === "loot") return t("ev_loot").replace("{name}", ev.name || "")
      + (ev.owner ? " — " + t("lootFor").replace("{pc}", ev.owner) : "");
    if (ev.type === "levelup") {
      s = s.replace("{level}", ev.level);
      // (\u2066…\u2069 keeps "+6" reading left-to-right inside Hebrew text)
      if (ev.hp_gain) s += ` · ${t("rolledHp")} \u2066+${ev.hp_gain}\u2069`;
      if (ev.asi) Object.entries(ev.asi).forEach(([k, v]) => { s += ` · \u2066${k.toUpperCase()} +${v}\u2069`; });
      if (ev.wish) s += ` · "${ev.wish}"`;
      return s;
    }
    if (ev.type === "join" && ev.concept) s += " — " + ev.concept;
    if (ev.type === "join" && ev.rolled && ev.rolled.stats) {
      const r = ev.rolled;
      s += " · 🎲 \u2066" + Object.entries(r.stats).map(([k, v]) => k.toUpperCase() + " " + v).join(", ") + "\u2069";
      if (r.hp) s += ` · ${t("rolledHp")} ${r.hp} · ${t("rolledAc")} ${r.ac}`;
      if (r.tries > 1) s += " · " + t("rollTry").replace("{n}", r.tries);
    }
    return s;
  }

  // ---------------------------------------------------- the GM's turn ---
  // The server says when the GM started on the players' actions, how long its
  // turns usually take (the median of the last ones) and what it is doing right
  // now (reported by a Claude Code hook as its tools run). The bar fills toward
  // that estimate and never pretends: past it, it says the turn is running long.
  let progressState = { state: "idle" }, waitingOn = [], lastGmId = 0, mySentId = 0, mySentAt = 0;
  const serverNow = () => (Date.now() + skew) / 1000;
  function fmtWait(secs) {
    if (secs >= 90) return t("min").replace("{n}", String(Math.round(secs / 60)));
    const n = secs > 10 ? Math.round(secs / 5) * 5 : Math.max(1, Math.round(secs));
    return t("sec").replace("{n}", String(n));
  }
  function showProgress(what, eta, pct) {
    const box = $("progress");
    box.classList.remove("hidden");
    box.classList.toggle("indeterminate", pct == null);
    $("progress-what").textContent = what;
    $("progress-eta").textContent = eta || "";
    box.querySelector(".fill").style.width = pct == null ? "" : pct.toFixed(1) + "%";
    if (pct == null) box.removeAttribute("aria-valuenow");
    else box.setAttribute("aria-valuenow", String(Math.round(pct)));
  }
  // The round: once someone acts, everyone has a minute (the server's clock).
  const ROUND_URGENT = 15;
  let roundState = { open: false }, roundChimed = {};
  const fmtClock = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  function chime() {
    try {
      const ctx = audioCtx();
      [0, 0.22].forEach((at) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, ctx.currentTime + at);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + at + 0.18);
        o.connect(g).connect(ctx.destination);
        o.start(ctx.currentTime + at); o.stop(ctx.currentTime + at + 0.2);
      });
    } catch (e) {}
  }
  function showRound() {
    const r = roundState;
    const left = r && r.open ? r.deadline - serverNow() : 0;
    const box = $("progress");
    if (!(left > 0)) { box.classList.remove("urgent"); return false; }
    const mine = !!me && (r.waiting_on || []).includes(me);
    // Not acted yet: one extra minute per round, for the asking.
    const ext = $("extend");
    ext.classList.toggle("hidden", !(mine && !(r.extended_by || []).includes(me)));
    ext.title = t("extendTitle");
    const urgent = mine && left <= ROUND_URGENT;
    const clock = fmtClock(Math.ceil(left));
    const out = me && (r.out_of_action || {})[me];
    const redo = mine && (r.redo || {})[me] != null;
    showProgress(mine ? t(redo ? "roundRedo" : urgent ? "roundHurry" : "roundYours").replace("{t}", clock)
                 : out ? t("roundOut").replace("{why}", out).replace("{t}", clock)
                 : t("roundWaiting").replace("{names}", (r.waiting_on || []).join(", ")).replace("{t}", clock),
                 "", 100 * left / Math.max(1, r.total || r.seconds));
    box.classList.toggle("urgent", urgent);
    if (urgent && !roundChimed[r.started_at]) { roundChimed[r.started_at] = true; chime(); }
    return true;
  }
  function updateProgress() {
    tickExtras();
    if (showRound()) return;
    $("extend").classList.add("hidden");
    const p = progressState;
    if (p.state === "working" && lastGmId <= p.start_id) {
      const now = serverNow(), elapsed = Math.max(0, now - p.started_at);
      const est = Math.max(5, p.estimate || 45);
      // No tool has run for a while: the GM is composing the narration itself.
      let stage = p.stage || "reading";
      if (stage !== "translating" && now - (p.stage_at || p.started_at) > 8) stage = "writing";
      const pct = elapsed < est ? 95 * elapsed / est
                                : 95 + 4 * (1 - Math.exp(-(elapsed - est) / est));
      const left = est - elapsed;
      showProgress(t("st_" + stage), left > 3 ? t("etaLeft").replace("{t}", fmtWait(left))
                                              : t("etaLonger"), pct);
      return;
    }
    // My action is in, but the GM hasn't started on it yet.
    if (mySentId && lastGmId < mySentId && Date.now() - mySentAt < 15 * 60 * 1000) {
      const others = waitingOn.filter((n) => n !== me);
      showProgress(others.length ? t("sentWaiting").replace("{names}", others.join(", "))
                                 : t("sent"), "", null);
      return;
    }
    $("progress").classList.add("hidden");
  }
  setInterval(updateProgress, 250);
  // Whose move it is: a banner above the action box.
  function turnState() {
    if (!me) return null;
    const r = roundState || {}, p = progressState || {};
    const left = r.open ? r.deadline - serverNow() : 0;
    const waiting = r.open ? (r.waiting_on || []) : waitingOn;
    const out = (r.out_of_action || {})[me];
    if (out) return ["out", t("turnOut").replace("{why}", tx(String(out)))];
    if (left > 0 && waiting.includes(me) && (r.redo || {})[me] != null) return ["redo", t("turnRedo")];
    if (p.state === "working" && lastGmId <= p.start_id) return ["gm", t("turnGm")];
    if (left > 0 && waiting.includes(me))
      return ["yours", t("turnYoursClock").replace("{t}", fmtClock(Math.ceil(left)))];
    if (left > 0 || (mySentId && lastGmId < mySentId)) {
      const others = waiting.filter((n) => n !== me);
      return ["sent", others.length ? t("turnSent").replace("{names}", others.join(", ")) : t("turnSentAll")];
    }
    // The round closed without my action: I hold this round (never "your move" now -
    // what I type goes to the next round).
    if (r.timed_out && (r.waiting_on || []).includes(me)) return ["missed", t("turnMissed")];
    if (p.state === "queued" || (p.state === "working" && lastGmId <= p.start_id)) return ["gm", t("turnGm")];
    return ["yours", t("turnFree")];
  }
  function updateTurn() {
    const el = $("turn"), st = turnState();
    if (!st) { el.classList.add("hidden"); return; }
    el.classList.remove("hidden");
    if (el.dataset.k !== st[0]) { el.className = st[0]; el.dataset.k = st[0]; }
    if (el.textContent !== st[1]) el.textContent = st[1];
  }
  tickHooks.push(updateTurn);
  $("extend").onclick = async () => {
    $("extend").disabled = true;
    const r = await api("/api/extend", {});
    $("extend").disabled = false;
    if (r.round) roundState = r.round;
    if (!r.ok) setStatus(r.error || "?");
    updateProgress();
  };

  // Every player reads one language. A message written in another one shows its
  // translation (sent by the GM with `gm-table.sh translate`), with the original a
  // tap away; until the translation arrives, the original shows, marked.
  const msgEls = new Map();            // message id -> its element, to update in place
  const showOriginal = new Set();      // ids this player flipped back to the original
  function sourceLang(m) {
    if (m.lang) return m.lang;
    const rtl = dirFor(m.text || "") === "rtl";
    const fits = LANGS.filter((x) => !!x.rtl === rtl).map((x) => x.code);
    return fits.includes("en") ? "en" : fits[0] || (rtl ? "he" : "en");
  }
  function readable(m) {
    if (m.kind === "system" || !m.text || (m.kind === "player" && m.pc === me)) return null;
    if (m.kind === "gm" && m.lang) return null;           // already one version per language
    const src = sourceLang(m);
    if (src === lang) return null;
    const tr = (m.tr || {})[lang];
    if (m.kind === "gm" && !tr) return null;   // narration: the GM posts per language
    return { src, text: tr || null };
  }

  function addMessage(m) {
    const d = renderMessage(m);
    if (!d) return;
    const log = $("log");
    if (m.kind === "system" && !m.image) {            // quiet notices share one strip
      let strip = log.lastElementChild;
      if (!strip || !strip.classList.contains("notices")) {
        strip = document.createElement("div");
        strip.className = "notices";
        log.appendChild(strip);
      }
      strip.appendChild(d);
      return;
    }
    log.appendChild(d);
  }
  function updateMessage(m) {
    const going = reveals.find((r) => r.id === m.id);
    if (going) finishReveal(going);
    const old = msgEls.get(m.id);
    const fresh = renderMessage(m);
    if (old && fresh) old.replaceWith(fresh);
    else if (fresh) $("log").appendChild(fresh);
  }

  // A roll the TABLE made (players see it the moment the GM does). Its DC/AC
  // arrived in the same request as the roll, so it was fixed before the dice landed.
  function renderRoll(m, d) {
    const ev = m.event || {};
    if (ev.secret) { d.textContent = t("rollSecret"); return; }
    const r = ev.roll || {};
    let why = (ev.why_tr || {})[lang] || ev.why || "";
    // The referee's rolls say where every number came from: "⚖ what · why · why".
    const sourced = /^⚖/.test(ev.why || "");
    let reasons = [];
    if (/^⚖/.test(why)) {
      const parts = why.replace(/^⚖\s*/, "").split(" · ").filter(Boolean);
      why = parts.shift() || "";
      reasons = parts;
    }
    if (r.outcome) d.classList.add(r.outcome === "success" ? "success" : "failure");
    const head = document.createElement("div");
    head.className = "goal";
    const what = document.createElement("span");
    what.className = "what";
    what.textContent = "🎯 " + [m.pc || t("rollBy"), why].filter(Boolean).join(" — ")
      + (r.target != null ? ` · ${t(r.target_label === "AC" ? "rollAC" : "rollDC")} ${r.target}` : "");
    what.dir = dirFor(what.textContent);
    head.appendChild(what);
    const list = document.createElement("ul");
    list.className = "why-list hidden";
    if (sourced) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "why-btn"; b.textContent = "⚖"; b.title = t("rollWhy");
      b.setAttribute("aria-expanded", "false");
      b.onclick = () => b.setAttribute("aria-expanded", String(!list.classList.toggle("hidden")));
      head.appendChild(b);
      (reasons.length ? reasons : [t("rollNoEdge")]).concat(
        r.modifier ? [t("rollMod").replace("{n}", (r.modifier > 0 ? "+" : "−") + Math.abs(r.modifier))] : [])
        .forEach((x) => { const li = document.createElement("li"); li.textContent = x; li.dir = "auto"; list.appendChild(li); });
    }
    // The sum is an isolated left-to-right block (math reads that way in both
    // languages); the words around it follow the reader's language, each in its
    // own isolate so Hebrew never pulls the numbers out of order.
    const line = document.createElement("div");
    line.className = "dice";
    line.dir = isRtl(lang) ? "rtl" : "ltr";
    const mod = r.modifier ? ` ${r.modifier > 0 ? "+" : "−"} ${Math.abs(r.modifier)}` : "";
    const math = document.createElement("bdi");
    math.dir = "ltr";
    math.innerHTML = `🎲 <bdi dir="${isRtl(lang) ? "rtl" : "ltr"}">${esc(heDice(r.notation || ""))}</bdi>: [${esc((r.rolls || []).join("+"))}]`
      + `${esc(mod)} = <span class="total">${esc(r.total)}</span>`;
    line.appendChild(math);
    const word = (text, cls) => {
      const w = document.createElement("bdi");
      if (cls) w.className = cls;
      w.textContent = text;
      line.append("  ", w);
    };
    if ((r.discarded || []).length) word(`(${t("rollDropped")} ${r.discarded.join(", ")})`, "goal");
    // Natural 1/20 decide only attack rolls (vs AC). On a check or save the total decides:
    // a 1 that succeeds adds a complication, a 20 that falls short is a near thing - and a
    // miss by 1-4 may be offered as success at a cost (CLAUDE.md, Dice).
    if (r.target_label === "AC" && (r.natural === 20 || r.natural === 1)) word(t(r.natural === 20 ? "rollNat20" : "rollNat1"), "nat");
    else if (r.natural === 1 && r.outcome === "success") word(t("rollNat1Check"), "nat");
    else if (r.natural === 20 && r.outcome === "failure") word(t("rollNat20Check"), "nat");
    else if (r.outcome === "failure" && r.target_label !== "AC" && r.target != null
             && r.target - r.total >= 1 && r.target - r.total <= 4) word(t("rollNearMiss"), "nat");
    if (r.outcome) word(t(r.outcome === "success" ? "rollSuccess" : "rollFailure"),
                        r.outcome === "success" ? "ok" : "bad");
    d.append(head, line, list);
  }

  // Your own action stays editable until the GM answers it (the server checks too).
  const editing = new Set();           // ids whose edit box is open
  // Your own action, until the GM reads it (then it plays it out: rolls for it).
  // Its first EDIT_GRACE seconds are always yours: the GM can't read it sooner.
  const EDIT_GRACE = 5, graceTimers = new Set();
  function canEdit(m) {
    if (m.kind !== "player" || !me || m.pc !== me || m.read) return false;
    const young = m.t && serverNow() - m.t < EDIT_GRACE;
    if (young && !graceTimers.has(m.id)) {
      graceTimers.add(m.id);
      setTimeout(() => { graceTimers.delete(m.id); refreshEditable(); }, (m.t + EDIT_GRACE - serverNow()) * 1000 + 100);
    }
    return !allMessages.some((x) => x.id > m.id && ((x.kind === "roll" && !young)
                                                     || (x.kind === "gm" && (!x.to || x.to === me))));
  }
  function refreshEditable() {
    allMessages.forEach((m) => {
      const el = msgEls.get(m.id);
      if (el && el.querySelector(".edit-btn") && !canEdit(m)) { editing.delete(m.id); updateMessage(m); }
      else if (el && m.kind === "player" && m.pc === me && (el.dataset.pend || "") !== pendState(m)) updateMessage(m);
    });
  }
  // My action's state: "sent" (still mine to fix) → "read" (the GM has it) → answered.
  function pendState(m) {
    if (m.kind !== "player" || m.pc !== me || m.redo) return "";
    if (!m.read) return "sent";
    return allMessages.some((x) => x.id > m.id && x.kind === "gm" && (!x.to || x.to === me)) ? "" : "read";
  }
  function openEditor(m, d) {
    editing.add(m.id);
    const body = d.querySelector(".body");
    const box = document.createElement("textarea");
    box.className = "edit-box";
    box.value = m.text || "";
    box.dir = dirFor(box.value) || (isRtl(lang) ? "rtl" : "ltr");
    box.oninput = () => { box.dir = dirFor(box.value); };
    const bar = document.createElement("div");
    bar.className = "edit-actions";
    const save = document.createElement("button");
    save.type = "button"; save.textContent = t("editSave");
    const cancel = document.createElement("button");
    cancel.type = "button"; cancel.textContent = t("editCancel");
    const close = () => { editing.delete(m.id); updateMessage(m); };
    cancel.onclick = close;
    save.onclick = async () => {
      const text = box.value.trim();
      if (!text) return;
      if (text === m.text) return close();
      save.disabled = true;
      const r = await api("/api/edit", { id: m.id, text });
      if (r.ok && r.message) {
        const i = allMessages.findIndex((x) => x.id === m.id);
        if (i >= 0) allMessages[i] = r.message;
        editing.delete(m.id);
        updateMessage(r.message);
      } else {
        setStatus(r.reason === "answered" ? t("editTooLate") : (r.error || "?"));
        close();
      }
    };
    box.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); save.onclick(); }
      else if (ev.key === "Escape") { ev.preventDefault(); close(); }
    });
    bar.append(cancel, save);
    body.replaceWith(box);
    box.after(bar);
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
  }

  // Pictures shown small come as small JPEGs (w): much faster over the tunnel.
  function imageUrl(name, w) {
    return "/images/" + encodeURIComponent(name) + "?code=" + encodeURIComponent(code) + (w ? "&w=" + w : "");
  }
  function imageEl(name, w) {
    const img = document.createElement("img");
    img.alt = ""; img.loading = "lazy"; img.src = imageUrl(name, w);
    return img;
  }

  // ---------------------------------------------- hover cards for names ---
  let loreTerms = [], loreSig = "", loreRe = null;
  const loreCards = new Map();          // term -> {data, at}
  // Hebrew vowel points (niqqud): a name matches with or without them (קֶסְטְרֶל, קסטרל).
  const NIQQUD = /[\u0591-\u05BD\u05BF\u05C1\u05C2\u05C4\u05C5\u05C7]/g;
  const unpointed = (s) => s.replace(NIQQUD, "");
  function buildLoreRe() {
    if (!loreTerms.length) { loreRe = null; return; }
    const esc_ = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const pointable = (s) => [...unpointed(s)].map((ch) => esc_(ch) +
      (/[\u05D0-\u05EA]/.test(ch) ? "[\\u0591-\\u05BD\\u05BF\\u05C1\\u05C2\\u05C4\\u05C5\\u05C7]*" : "")).join("");
    // A Hebrew name may carry up to two one-letter prefixes (ולספי) but must end the
    // word: ספי (Sefi) is not in הספיק ("was enough").
    const hebrewWord = (t) => "(?<=(?:^|[^\\p{L}\\p{M}\\p{N}])(?:[והבלמשכ][\\u0591-\\u05BD\\u05BF\\u05C1\\u05C2\\u05C4\\u05C5\\u05C7]*){0,2})" +
      pointable(t) + "(?![\\p{L}\\p{N}])";
    loreRe = new RegExp(loreTerms.map((t) => /[A-Za-z]/.test(t.term)
      ? "(?<![\\p{L}\\p{N}])" + esc_(t.term) + "(?![\\p{L}\\p{N}])" : hebrewWord(t.term)).join("|"), "giu");
  }
  function wrapLore(body) {
    if (!loreRe || !body) return;
    const walk = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => n.parentElement && n.parentElement.closest(".lore")
        ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const nodes = [];
    let n;
    while ((n = walk.nextNode())) nodes.push(n);
    nodes.forEach((node) => {
      const text = node.data;
      loreRe.lastIndex = 0;
      if (!loreRe.test(text)) return;
      loreRe.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let last = 0, mm;
      while ((mm = loreRe.exec(text))) {
        if (mm.index > last) frag.appendChild(document.createTextNode(text.slice(last, mm.index)));
        const span = document.createElement("span");
        span.className = "lore"; span.textContent = mm[0]; span.dataset.term = unpointed(mm[0]);
        span.tabIndex = 0;
        frag.appendChild(span);
        last = mm.index + mm[0].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.replaceWith(frag);
    });
  }
  function rewrapAll() {
    msgEls.forEach((el) => {
      if (el.classList.contains("gm") && !el.classList.contains("revealing")) wrapLore(el.querySelector(".body"));
    });
  }
  function setLoreTerms(terms) {
    const sig = JSON.stringify(terms || []);
    if (sig === loreSig) return;
    loreSig = sig; loreTerms = terms || []; buildLoreRe(); rewrapAll();
  }
  let loreTimer = null, loreFor = null;
  async function showLore(span) {
    const card = $("lore-card");
    loreFor = span;
    const term = span.dataset.term;
    const place = () => {
      const r = span.getBoundingClientRect(), w = card.offsetWidth, h = card.offsetHeight;
      let top = r.bottom + 6;
      if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
      card.style.top = top + "px";
      card.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + "px";
    };
    const fill = (d, loading) => {
      card.textContent = "";
      if (d && d.image) {
        const img = imageEl(d.image, 400);
        img.loading = "eager";
        img.onload = place;             // its size is known now: keep the card on screen
        card.appendChild(img);
      }
      const head = document.createElement("div");
      head.className = "head"; head.dir = "auto"; head.textContent = (d && d.name) || term;
      const kind = document.createElement("span");
      kind.className = "kind"; kind.textContent = d ? t("lore_" + d.kind) : "";
      head.appendChild(kind);
      const sub = document.createElement("div");
      sub.className = "sub"; sub.dir = "auto";
      sub.textContent = d && d.sub ? d.sub.replace(/^(.*?)level (\d+)$/, (_, a, n) => a + t("lvl") + " " + n) : "";
      const text = document.createElement("div");
      text.className = "text" + (loading ? " loading" : "");
      text.textContent = loading ? t("loreLoading") : heDice(d.text || "");
      text.dir = dirFor(text.textContent);
      card.append(head);
      if (sub.textContent) card.append(sub);
      card.append(text);
      card.classList.remove("hidden");
      place();
    };
    // A card is kept until the story mentions the name again (its n changes);
    // then the old one shows at once while the host brings it up to date.
    const info = loreTerms.find((x) => x.term.toLowerCase() === term.toLowerCase());
    const cached = loreCards.get(term);
    if (cached) {
      fill(cached.data);
      const current = info ? info.n === cached.data.n : Date.now() - cached.at < 60000;
      if (current && !cached.data.stale) return;
    } else {
      fill(null, true);
    }
    for (let tries = 0; tries < 10; tries++) {
      const r = await api("/api/lore?term=" + encodeURIComponent(term));
      if (r.ok) loreCards.set(term, { data: r, at: Date.now() });
      if (loreFor !== span) return;
      if (r.ok || !cached) fill(r.ok ? r : { name: term, kind: "", text: r.error || "" });
      if (!r.ok || !r.stale) return;
      await new Promise((ok) => setTimeout(ok, 3000));   // the fresh one is being written
      if (loreFor !== span) return;
    }
  }
  function hideLore() { loreFor = null; $("lore-card").classList.add("hidden"); }
  document.addEventListener("mouseover", (ev) => {
    const span = ev.target.closest && ev.target.closest(".lore");
    if (!span) return;
    clearTimeout(loreTimer);
    loreTimer = setTimeout(() => showLore(span), 250);
  });
  document.addEventListener("mouseout", (ev) => {
    const span = ev.target.closest && ev.target.closest(".lore");
    if (!span) return;
    clearTimeout(loreTimer);
    loreTimer = setTimeout(() => { if (!$("lore-card").matches(":hover")) hideLore(); }, 300);
  });
  $("lore-card").addEventListener("mouseleave", () => { loreTimer = setTimeout(hideLore, 300); });
  $("lore-card").addEventListener("mouseenter", () => clearTimeout(loreTimer));
  $("log").addEventListener("click", (ev) => {            // tap, on a phone
    const span = ev.target.closest && ev.target.closest(".lore");
    if (span) { ev.stopPropagation(); showLore(span); }
  }, true);
  document.addEventListener("click", (ev) => {
    if (!ev.target.closest(".lore") && !ev.target.closest("#lore-card")) hideLore();
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") hideLore(); });
  $("log").addEventListener("focusin", (ev) => { if (ev.target.classList.contains("lore")) showLore(ev.target); });
  $("log").addEventListener("scroll", hideLore);

  function renderMessage(m) {
    if (!shownToMe(m)) return null;
    if (m.kind === "gm" && !m.to) lastGmId = Math.max(lastGmId, m.id);
    const d = document.createElement("div");
    d.className = "msg " + m.kind + (m.to ? " whisper" : "") + (m.pc === me && m.kind === "player" ? " mine" : "");
    const redoFor = m.kind === "gm" && m.event && m.event.type === "redo" ? m.event.pc : null;
    if (redoFor) d.classList.add("redo", ...(redoFor === me ? ["for-me"] : []), ...(m.event.warn ? ["warn"] : []));
    if (m.kind === "player" && m.redo) d.classList.add("redone");
    if (m.kind === "roll") {
      renderRoll(m, d);
    } else if (m.kind === "system") {
      d.textContent = systemText(m);
      d.dir = dirFor(d.textContent);
      if ((m.event || {}).type === "punished") d.classList.add("punished");
      if ((m.event || {}).type === "grew") d.classList.add("grew");
      if (m.image) {
        const img = imageEl(m.image, 800);
        const ev = m.event || {};
        const tab = { place: "places", npc: "people", foe: "foes", loot: "treasures" }[ev.type];
        if (tab) {
          d.classList.add(ev.type === "foe" && ev.boss ? "boss" : ev.type);
          if (ev.type === "foe") d.classList.add("foe");
          img.style.cursor = "zoom-in";
          img.onclick = () => openGallery(tab, ev.location || ev.name);
        }
        d.appendChild(img);
      }
    } else {
      const who = document.createElement("div");
      who.className = "who";
      const label = document.createElement("span");
      if (m.kind === "gm") {
        label.textContent = t("gm") + (m.to ? " — " + t("whisper") : "")
          + (redoFor ? " — " + (m.event.warn ? (redoFor === me ? t("warnYou") : t("warnThem").replace("{pc}", redoFor))
                       : redoFor === me ? t("redoYou") : t("redoThem").replace("{pc}", redoFor)) : "");
      } else {
        const name = document.createElement("span");      // hover: who they are
        name.textContent = m.pc || "?";
        if (m.pc) { name.className = "lore"; name.dataset.term = m.pc; name.tabIndex = 0; }
        label.append(name, (m.voice ? " 🎤" : "") + (m.to ? " — " + t("toGm") : ""));
      }
      who.appendChild(label);
      if (m.edited) {
        const ed = document.createElement("span");
        ed.className = "edited"; ed.textContent = t("edited");
        who.appendChild(ed);
      }
      if (canEdit(m)) {
        const pen = document.createElement("button");
        pen.type = "button"; pen.className = "edit-btn"; pen.textContent = "✏️"; pen.title = t("edit");
        pen.onclick = () => openEditor(m, d);
        who.appendChild(pen);
      }
      if (m.kind === "gm" && m.text) {
        const play = document.createElement("button");
        play.type = "button"; play.textContent = "🔊"; play.title = t("replay");
        play.onclick = () => { stopSpeaking(); speak(m.text); };
        who.appendChild(play);
      }
      const body = document.createElement("div");
      body.className = "body";
      const tr = readable(m);
      const useTr = tr && tr.text && !showOriginal.has(m.id);
      body.innerHTML = md(heDice(useTr ? tr.text : (m.text || "")));
      if (m.kind === "gm") wrapLore(body);
      d.append(who, body);
      const pend = pendState(m);
      d.dataset.pend = pend;
      if (pend) {
        const note = document.createElement("div");
        note.className = "pend " + pend;
        note.textContent = t(pend === "sent" ? "pendSent" : "pendRead");
        d.appendChild(note);
      }
      if (m.kind === "player" && m.redo) {
        const note = document.createElement("div");
        note.className = "redo-note";
        note.textContent = t("redoMark");
        d.appendChild(note);
      }
      if (tr) {
        const note = document.createElement("div");
        note.className = "tr-note";
        if (tr.text) {
          note.append(t("trFrom").replace("{lang}", langLabel(tr.src)) + " · ");
          const flip = document.createElement("button");
          flip.type = "button";
          flip.textContent = useTr ? t("trShowOriginal") : t("trShowTranslation");
          flip.onclick = () => {
            if (showOriginal.has(m.id)) showOriginal.delete(m.id); else showOriginal.add(m.id);
            updateMessage(m);
          };
          note.appendChild(flip);
        } else {
          note.textContent = t("trWaiting");
          d.classList.add("translating");
        }
        d.appendChild(note);
      }
      if (m.image) {
        const img = document.createElement("img");
        img.alt = "";
        img.loading = "lazy";
        img.src = imageUrl(m.image);
        d.appendChild(img);
      }
    }
    msgEls.set(m.id, d);
    if (editing.has(m.id) && canEdit(m)) setTimeout(() => openEditor(m, d), 0);
    return d;
  }

  // "Previously on...": for a player sitting down (new, or back after a break
  // of 10 minutes or more), the story so far, at the top of the log.
  const seenKey = () => "seen." + code;
  let recapShown = false;
  async function maybeRecap() {
    if (recapShown || !me) return;
    if (Date.now() - Number(store.get(seenKey()) || 0) < 10 * 60 * 1000) return;
    if (!allMessages.some((m) => m.kind === "gm" && shownToMe(m))) return;
    recapShown = true;
    const card = document.createElement("div");
    card.id = "recap";
    card.innerHTML = `<h3>${esc(t("recapTitle"))}</h3><div class="text pending" dir="auto">${esc(t("recapLoading"))}</div>` +
      `<div class="row"><button type="button" class="primary">${esc(t("recapClose"))}</button></div>`;
    card.querySelector("button").onclick = () => { card.remove(); $("log").scrollTop = $("log").scrollHeight; };
    $("log").prepend(card);
    $("log").scrollTop = 0;
    for (let i = 0; i < 40 && card.isConnected; i++) {
      const r = await api("/api/recap?lang=" + encodeURIComponent(lang));
      if (!r.ok || !r.text) { card.remove(); return; }
      const box = card.querySelector(".text");
      box.textContent = r.text; box.dir = dirFor(r.text);
      box.classList.toggle("pending", !!r.pending);
      if (!r.pending) return;
      await new Promise((ok) => setTimeout(ok, 3000));
    }
  }
  setInterval(() => { if (me) store.set(seenKey(), String(Date.now())); }, 30000);
  window.addEventListener("pagehide", () => { if (me) store.set(seenKey(), String(Date.now())); });

  function rerenderLog() {
    finishAllReveals();
    partySig = "";
    $("log").textContent = "";
    msgEls.clear();
    allMessages.forEach(addMessage);
    $("log").scrollTop = $("log").scrollHeight;
  }

  async function pollMessages() {
    try {
      const r = await api("/api/messages?after=" + lastId + "&rev=" + lastRev);
      if (r.ok && typeof r.rev === "number") lastRev = Math.max(lastRev, r.rev);
      const changed = r.ok ? r.messages.filter((m) => m.id <= lastId) : [];
      changed.forEach((m) => {
        const i = allMessages.findIndex((x) => x.id === m.id);
        // (an edit box you have open stays open: your typing isn't thrown away)
        if (i >= 0) { allMessages[i] = m; if (!editing.has(m.id)) updateMessage(m); }
      });
      if (r.ok) r.messages = r.messages.filter((m) => m.id > lastId);
      if (r.ok && r.messages.length) {
        const log = $("log");
        const atBottom = logPinned;
        r.messages.forEach((m) => {
          allMessages.push(m); addMessage(m); lastId = Math.max(lastId, m.id);
          if (historyLoaded && m.kind === "roll" && msgEls.get(m.id)) msgEls.get(m.id).classList.add("fresh");
          if (m.kind === "gm") lastNarrSeen = Math.max(lastNarrSeen, m.id);
          // The GM ruled my action can't work: my turn to choose again, now.
          if (historyLoaded && m.kind === "gm" && m.event && m.event.type === "redo" && m.event.pc === me
              && shownToMe(m)) {
            mySentId = 0; chime();
            setTimeout(() => { try { $("text").focus(); } catch (e) {} }, 0);
          }
          // Only NEW narration is told (revealed, and read aloud) — not the history.
          if (historyLoaded && m.kind === "gm" && shownToMe(m) && msgEls.get(m.id)) {
            const r = startReveal(m, msgEls.get(m.id));
            if (readAloud && m.text && speak(m.text, r ? revealHooks(r) : null) && r) r.spoken = true;
          }
        });
        if (atBottom || !historyLoaded) followLog();
        else if (r.messages.some((m) => m.kind === "gm" || m.kind === "roll")) $("log-new").classList.remove("hidden");
        if (r.messages.some((m) => m.kind === "gm" || m.kind === "roll" || m.read)) {
          refreshEditable();
          refreshInfo();                    // (the banner and the round follow at once, not in 4 s)
        }
        const last = r.messages[r.messages.length - 1];
        updateProgress();
        // The music changed: fetch it now instead of on the next 4-second refresh,
        // so the new track starts with the narration it belongs to.
        // The music changed, or the narration arrived (the party's HP, held back
        // during the GM's turn, now catches up with the story): refresh now.
        if (historyLoaded && r.messages.some((m) => (m.event && /^music/.test(m.event.type))
                                                   || (m.kind === "gm" && !m.to)
                                                   || m.kind === "player")) refreshInfo();
      }
      if (!historyLoaded && r.ok) { historyLoaded = true; maybeRecap(); }
      historyLoaded = true;
    } catch (e) { setStatus(t("reconnecting")); }
    setTimeout(pollMessages, 1500);
  }

  // Quick actions: one tap starts an action from the sheet (it's only text: edit it, then send).
  let chipText = null;
  const itemName = (x) => typeof x === "string" ? x.split(/\s*[(\[]|\s+[—–-]\s+|:\s/)[0].trim()
                                                 : String((x && x.name) || "");
  function weaponsOf(sheet) {
    const out = [];
    (Array.isArray(sheet.attacks) ? sheet.attacks : []).forEach((a) => out.push(itemName(a)));
    (Array.isArray(sheet.equipment) ? sheet.equipment : []).forEach((x) => {
      const dice = typeof x === "string" ? /\d+d\d+/.test(x) : x && (x.damage || /\d+d\d+/.test(JSON.stringify(x)));
      if (dice) out.push(itemName(x));
    });
    return [...new Set(out.filter(Boolean))].slice(0, 3);
  }
  function spellsOf(sheet) {
    const out = [];
    ["cantrips", "spells"].forEach((k) => {
      const v = sheet[k];
      const list = Array.isArray(v) ? v : v && typeof v === "object" ? Object.values(v).flat() : [];
      list.forEach((x) => out.push(itemName(x)));
    });
    return [...new Set(out.filter((n) => n && n.length < 40))].slice(0, 4);
  }
  function renderChips() {
    const box = $("chips");
    if (!me || !partyShown.get(me)) { box.textContent = ""; box.dataset.sig = ""; return; }
    const sheet = mySheet || {};
    const foes = ((fightState && fightState.order) || []).filter((c) => c.foe && c.health !== "down");
    const aim = (aimAt && foes.some((f) => f.name === aimAt) ? aimAt : (foes[0] || {}).name) || null;
    const chips = [];
    weaponsOf(sheet).forEach((w) => chips.push(["⚔ " + tx(w), aim
      ? t("qa_attack").replace("{target}", aim).replace("{item}", tx(w)) : t("qa_attackAny").replace("{item}", tx(w))]));
    spellsOf(sheet).forEach((sp) => chips.push(["✨ " + tx(sp), aim
      ? t("qa_castAt").replace("{spell}", tx(sp)).replace("{target}", aim) : t("qa_cast").replace("{spell}", tx(sp))]));
    if (fightState) {
      chips.push(["🛡 " + t("chip_dodge"), t("qa_dodge")]);
      chips.push(["💨 " + t("chip_dash"), t("qa_dash")]);
    } else {
      chips.push(["👁 " + t("chip_look"), t("qa_look")]);
    }
    chips.push(["🫥 " + t("chip_hide"), t("qa_hide")]);
    partyLive.filter((p) => p.name !== me && p.claimed && p.status !== "dead").slice(0, 3)
      .forEach((p) => chips.push(["🤝 " + p.name, t("qa_help").replace("{pc}", p.name)]));
    const sig = lang + "|" + chips.map((c) => c.join("=")).join("|");
    if (box.dataset.sig === sig) return;
    box.dataset.sig = sig;
    box.textContent = "";
    chips.forEach(([label, text]) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; b.dir = "auto"; b.dataset.text = text;
      b.onclick = () => {
        const area = $("text"), cur = area.value.trim();
        area.value = !cur || cur === chipText ? text : cur + " " + text;
        chipText = area.value.trim();
        fitTextDir(); area.focus();
        try { area.setSelectionRange(area.value.length, area.value.length); } catch (e) {}
      };
      box.appendChild(b);
    });
  }
  uiHooks.push(renderChips);

  async function sendAction() {
    const text = $("text").value.trim();
    if (!text) return;
    $("send").disabled = true;
    const r = await api("/api/say", { text, private: $("private").checked, lang, voice: spoke });
    if (r.ok && r.message && !r.message.to) {
      mySentId = r.message.id; mySentAt = Date.now();
      updateProgress();
      setTimeout(refreshInfo, 1200);        // catch the GM starting on it quickly
    }
    $("send").disabled = false;
    if (!r.ok) { setStatus(r.error || "?"); if (r.error === "Take a seat first.") refreshInfo(); return; }
    $("text").value = "";
    fitTextDir();
    $("private").checked = false;
    spoke = false;
  }

  // ------------------------------------------------------------- wiring ---
  $("say").onsubmit = (ev) => { ev.preventDefault(); sendAction(); };
  const fitTextDir = () => { $("text").dir = $("text").value.trim() ? dirFor($("text").value)
                                                                   : (isRtl(lang) ? "rtl" : "ltr"); };
  $("text").addEventListener("input", fitTextDir);
  $("text").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendAction(); }
  });
  $("mic").onclick = toggleListening;
  $("read-toggle").onclick = () => {
    readAloud = !readAloud;
    store.set("read", readAloud ? "1" : "0");
    updateReadToggle();
    if (!readAloud) stopSpeaking();
    else speak(t("readOnSpoken"), null, lang);
  };
  $("music-toggle").onclick = () => {
    musicOn = !musicOn;
    store.set("music", musicOn ? "1" : "0");
    const m = musicState;
    musicState = null;            // force a restart (or a stop) of the current track
    if (track) { track.stop(); track = null; }
    applyMusic(m);
    audioCtx();
  };
  $("music-vol").value = String(musicVol);
  $("music-vol").oninput = () => {
    musicVol = parseFloat($("music-vol").value) || 0;
    store.set("musicVol", String(musicVol));
    levelChanged();
  };
  $("rate").value = store.get("rate") || "1";
  $("rate").onchange = () => store.set("rate", $("rate").value);
  // Switching language: everything is already there in every language the
  // adventure is played in, so the page just shows it.
  function setLang(next, chosen = true) {
    if (!next || next === lang) return fillLangPickers();
    lang = next;
    if (chosen) { langChosen = true; store.set("lang", lang); }
    sheetTr.clear();
    loreCards.clear();
    applyLang();
    if (!STRINGS[lang] || !STRINGS[lang].__done) loadStrings(lang);
    if (me) {
      api("/api/lang", { lang });
      if (sheetFor && $("sheet").open) loadSheetTr(sheetFor);
      rerenderLog(); refreshInfo(); updateProgress(); fitTextDir();
      if (sheetShown && $("sheet").open) renderSheet(sheetShown, true);   // its words, now in this language
    }
    if (!$("seat-cards").classList.contains("hidden")) refreshSeats();
  }
  document.querySelectorAll(".lang-pick").forEach((sel) => { sel.onchange = () => setLang(sel.value); });
  async function refreshSeats() {
    if (!me) token = store.get("token") || token;     // (a join sent from this browser)
    const info = await api("/api/info");
    if (!info.ok) return;
    setLanguages(info.languages);
    if (info.me && !me) { me = info.me; return openTable(info); }   // our join was answered
    showSeats(info);
  }
  // Keep the "who are you" list current while choosing (someone may join meanwhile).
  setInterval(() => {
    if (!me && code && !$("seat-cards").classList.contains("hidden")) refreshSeats();
  }, 4000);
  // The stop signal (the X): it reaches the GM at once, past the round; no reason needed.
  // A 3-second undo (it sits next to the menu on a phone); then the voice stops, and every
  // page shows the pause until the GM speaks again (it never says who asked).
  let stopTimer = null;
  $("stop-signal").onclick = () => {
    const b = $("stop-signal");
    if (stopTimer) {                                   // tapped again: undo
      clearTimeout(stopTimer); stopTimer = null;
      b.setAttribute("aria-pressed", "false"); b.textContent = "✋";
      setStatus(t("stopUndone"));
      return;
    }
    b.setAttribute("aria-pressed", "true"); b.textContent = "✋ 3";
    setStatus(t("stopSoon"));
    let n = 3;
    const tick = () => {
      n -= 1;
      if (n > 0) { b.textContent = "✋ " + n; stopTimer = setTimeout(tick, 1000); return; }
      stopTimer = null; b.textContent = "✋";
      stopSpeaking();
      api("/api/stop", {}).then((r) => {
        setStatus(r && r.ok ? t("stopSent") : (r && r.error) || "✗", !(r && r.ok));
        if (r && r.ok) showPaused(true);
      });
    };
    stopTimer = setTimeout(tick, 1000);
  };
  function showPaused(on) {
    $("paused").classList.toggle("hidden", !on);
    if (!stopTimer) $("stop-signal").setAttribute("aria-pressed", on ? "true" : "false");
  }
  $("leave").onclick = async () => {
    if (!confirm(t("leaveConfirm"))) return;
    await api("/api/leave", {});
    token = null; me = null; store.set("token", null);
    location.reload();
  };
  $("party-toggle").onclick = () => {
    $("party").style.top = headerBottom() + "px";
    $("party").classList.toggle("open");
    $("chat").classList.remove("open");
    setMoreMenu(false);
  };
  // Phone: the bottom tabs. Party and chat open as panels over the story, between
  // the header and the tabs; the sheet opens as its dialog.
  function syncTabs() {         // (what's open, however it was opened)
    const which = $("sheet").open ? "sheet" : $("party").classList.contains("open") ? "party"
      : $("chat").classList.contains("open") ? "chat" : "story";
    ["story", "party", "sheet", "chat"].forEach((k) => {
      const b = $("tab-" + k), on = String(k === which);
      if (b.getAttribute("aria-pressed") !== on) b.setAttribute("aria-pressed", on);
    });
  }
  tickHooks.push(syncTabs);
  function setTab(which) {
    const top = headerBottom() + "px";
    document.documentElement.style.setProperty("--tabs-h", $("tabs").getBoundingClientRect().height + "px");
    $("party").classList.toggle("open", which === "party");
    $("chat").classList.toggle("open", which === "chat");
    $("party").style.top = top; $("chat").style.top = top;
    if (which === "chat") { setUnread(0); $("chat-log").scrollTop = $("chat-log").scrollHeight; }
    if (which === "sheet" && me) openSheet(me);
    else if ($("sheet").open) $("sheet").close();
    setMoreMenu(false);
    syncTabs();
  }
  $("tab-story").onclick = () => setTab("story");
  $("tab-party").onclick = () => setTab($("party").classList.contains("open") ? "story" : "party");
  $("tab-sheet").onclick = () => setTab("sheet");
  $("tab-chat").onclick = () => setTab($("chat").classList.contains("open") ? "story" : "chat");
  // The ⋯ menu (phone only): music, reading aloud, language, leaving. It closes
  // after a choice, on a tap anywhere else, and when another drawer opens.
  function setMoreMenu(open) {
    const menu = $("more-menu");
    if (open) menu.style.top = (headerBottom() + 4) + "px";
    menu.classList.toggle("open", open);
    $("more-toggle").setAttribute("aria-expanded", String(open));
  }
  $("more-toggle").onclick = (ev) => {
    ev.stopPropagation();
    const open = !$("more-menu").classList.contains("open");
    if (open) { $("party").classList.remove("open"); $("chat").classList.remove("open"); }
    setMoreMenu(open);
  };
  $("more-menu").addEventListener("click", (ev) => {
    if (ev.target.closest("button")) setMoreMenu(false);
    else ev.stopPropagation();                  // (the language list: keep it open)
  });
  $("more-menu").addEventListener("change", () => setMoreMenu(false));
  document.addEventListener("click", (ev) => {
    if (!ev.target.closest("#more-menu")) setMoreMenu(false);
  });
  $("chat-toggle").addEventListener("click", () => setMoreMenu(false));
  $("code-go").onclick = enterCode;
  $("code").addEventListener("keydown", (ev) => { if (ev.key === "Enter") enterCode(); });
  // Rolling a character: the server rolls and keeps the numbers; we show them,
  // fill in a name and concept if they're empty (the player can change those).
  let rolled = null, rolledFill = { name: "", concept: "" };
  async function rollCharacter() {
    $("roll-char").disabled = true;
    const r = await api("/api/roll-character", { lang, previous: rolled && rolled.roll_id });
    $("roll-char").disabled = false;
    if (!r.ok) { $("seat-error").textContent = r.error || "?"; return; }
    rolled = r;
    // Replace our own earlier suggestions, never what the player typed.
    [["new-name", "name"], ["new-concept", "concept"]].forEach(([id, k]) => {
      const box = $(id);
      if (!box.value.trim() || box.value === rolledFill[k]) { box.value = r[k] || ""; rolledFill[k] = box.value; }
    });
    const out = $("rolled");
    out.classList.remove("hidden");
    out.innerHTML = '<div class="boxes">' + Object.entries(r.dice).map(([k, d]) =>
      `<div class="box"><div class="k">${esc(k)}</div><div class="v">${esc(d.score)}</div>` +
      `<div class="d" dir="ltr">${d.dice.map((x, i) => i === d.dropped ? `<s>${x}</s>` : x).join(" ")}</div></div>`
    ).join("") + "</div>" +
      (r.class ? `<div class="who-rolled" dir="auto"><b>${esc(lang === "he" && r.concept ? r.concept : r.race + " " + r.class)}</b> · ` +
                 `${esc(t("rolledHp"))} ${esc(r.hp)} · ${esc(t("rolledAc"))} ${esc(r.ac)}</div>` : "") +
      `<p class="muted">${esc(t("rolledNote"))}` +
      (r.tries > 1 ? " · " + esc(t("rollTry").replace("{n}", r.tries)) : "") + "</p>";
    $("roll-char").textContent = t("rollAgain");
  }
  $("roll-char").onclick = rollCharacter;
  $("create").onclick = () => {
    const name = $("new-name").value.trim();
    if (!name) { $("seat-error").textContent = t("nameRequired"); return; }
    seat("/api/create", { name, concept: $("new-concept").value.trim(),
                          sex: $("new-sex").value || undefined,
                          roll_id: rolled ? rolled.roll_id : undefined });
  };
  $("nameless").onclick = () => seat("/api/create", { mode: "nameless" });
  if (!SR) $("mic").title = t("noMic");

  applyLang();
  $("code").value = code;
  if (code) enterCode();
})();
</script>
</body>
</html>

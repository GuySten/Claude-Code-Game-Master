[project]
name = "gm-claude"
version = "0.2.0"
description = "AI-powered D&D Game Master assistant for running campaigns with Claude Code"
authors = [
    { name = "Sean Stobo" }
]
readme = "README.md"
license = { text = "CC-BY-NC-SA-4.0" }
requires-python = ">=3.11"
keywords = ["dnd", "dungeons-and-dragons", "claude", "ai", "dm", "dungeon-master"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
]

# Core dependencies only - minimal for basic functionality
dependencies = [
    "anthropic>=0.76.0",
    "pdfplumber>=0.11.9",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    # Natural read-aloud voices for the online table (Hebrew too), made on the host.
    "edge-tts>=7.0",
]

[project.optional-dependencies]
# Voice features (ElevenLabs TTS)
voice = [
    "elevenlabs>=2.8.1",
]

# RAG-based document extraction
rag = [
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    # Listed directly (sentence-transformers pulls it in anyway) so the source
    # below applies: the CPU-only build. The embedding model is tiny and runs
    # fine on CPU; PyPI's default Linux build bundles several GB of CUDA libraries.
    "torch>=2.2",
]

# Full installation (all features)
full = [
    "gm-claude[voice]",
    "gm-claude[rag]",
]

# Development dependencies
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/Sstobo/Claude-Code-Game-Master"
Documentation = "https://github.com/Sstobo/Claude-Code-Game-Master/wiki"
Repository = "https://github.com/Sstobo/Claude-Code-Game-Master"
Issues = "https://github.com/Sstobo/Claude-Code-Game-Master/issues"
Author = "https://www.linkedin.com/in/sean-stobo/"

# PyTorch comes from PyTorch's CPU-only index on Linux and Windows. macOS keeps
# PyPI's build, which is already CPU/Metal only (the CPU index has no macOS
# wheels for every release).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["lib", "features"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.txt"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "A", "C4", "SIM", "RET"]
ignore = ["E501"]  # Line too long - handled by black
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
